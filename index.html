<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>√x</title>

<style>

/* =====================================================
   全体
===================================================== */

* {
    box-sizing: border-box;
}

body {

    margin: 0;
    padding: 10px;

    background: #f2f2f2;
    color: #222;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;

}

.container {

    max-width: 900px;

    margin: auto;
    padding: 15px;

    background: white;

    border-radius: 15px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,0.15);

}

h1 {

    text-align: center;

    margin: 5px 0 15px;

}

.center {
    text-align: center;
}

.hidden {
    display: none !important;
}


/* =====================================================
   ボタン
===================================================== */

button {

    padding: 11px 18px;

    margin: 5px;

    font-size: 17px;

    background: white;

    border: 1px solid #888;

    border-radius: 8px;

}

button:active {
    transform: scale(0.97);
}


/* =====================================================
   セレクト
===================================================== */

select {

    padding: 8px;

    font-size: 18px;

    border-radius: 6px;

}


/* =====================================================
   スタート画面
===================================================== */

.mode-box {

    margin: 18px 0;

    padding: 15px;

    border: 2px solid #aaa;

    border-radius: 10px;

    text-align: left;

}

.mode-box label {

    display: block;

    margin: 10px 0;

    font-size: 18px;

}

.mode-description {

    margin: 8px 0 0 28px;

    color: #555;

    line-height: 1.6;

}

.option-box {

    margin-top: 15px;

    padding: 12px;

    background: #f5f5f5;

    border-radius: 8px;

}


/* =====================================================
   ゲーム画面
===================================================== */

#gameArea {

    padding: 15px;

    text-align: center;

    background: #fafafa;

    border: 2px solid #444;

    border-radius: 12px;

}

#sqrtQuestion {

    font-size: 28px;

    font-weight: bold;

}

#turnDisplay {

    margin-top: 18px;

    font-size: 21px;

    font-weight: bold;

}


/* =====================================================
   タイマー
===================================================== */

#timerDisplay {

    margin-top: 10px;

    font-size: 26px;

    font-weight: bold;

    font-family: monospace;

}


/* =====================================================
   オーバー表示
===================================================== */

#overDisplay {

    margin: 12px 0;

    font-size: 30px;

    font-weight: bold;

    color: red;

}


/* =====================================================
   現在の数字
===================================================== */

#currentNumber {

    display: flex;

    align-items: center;

    justify-content: center;

    margin: 20px 0;

    padding: 8px 5px;

    overflow-x: auto;

    white-space: nowrap;

    -webkit-overflow-scrolling: touch;

}

.decimal-label {

    flex-shrink: 0;

    font-family: monospace;

    font-size: 34px;

    font-weight: bold;

}


/* =====================================================
   数字入力
===================================================== */

.digit-box {

    flex-shrink: 0;

    width: 48px;
    min-width: 48px;

    height: 54px;

    margin: 3px;
    padding: 0;

    text-align: center;

    font-family: monospace;

    font-size: 30px;

    line-height: 50px;

    border: 2px solid #777;

    border-radius: 6px;

    background: white;

}

.digit-box:focus {

    outline: none;

    border: 3px solid #333;

}


/* =====================================================
   二乗表示
===================================================== */

#squareDisplay {

    margin-top: 15px;

    padding: 15px;

    background: #eaeaea;

    border-radius: 8px;

    font-size: 24px;

    font-weight: bold;

    line-height: 1.7;

}

.safe {
    color: green;
}

.over {
    color: red;
}


/* =====================================================
   カウント警告
===================================================== */

#warning {

    margin-top: 15px;

    padding: 12px;

    background: #fff7d6;

    border: 2px solid #d6a900;

    border-radius: 8px;

    color: #765900;

    font-weight: bold;

    white-space: pre-line;

}


/* =====================================================
   メッセージ
===================================================== */

#message {

    margin-top: 15px;

    padding: 10px;

    background: #eee;

    border-radius: 8px;

}


/* =====================================================
   ボーナス
===================================================== */

#bonusLog {

    min-height: 25px;

    margin-top: 15px;

    font-weight: bold;

}


/* =====================================================
   ポイント表
===================================================== */

#scoreTitle {

    margin-top: 20px;

}

#playerTable {

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 10px;

    margin-top: 15px;

}

.player-card {

    width: 115px;

    min-height: 75px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    background: white;

    border: 2px solid #555;

    border-radius: 10px;

}

.player-number {

    font-size: 17px;

    font-weight: bold;

}

.player-score {

    margin-top: 5px;

    font-size: 24px;

}

.player-card.eliminated {

    opacity: 0.4;

    text-decoration: line-through;

}


/* =====================================================
   結果
===================================================== */

#result {

    font-size: 18px;

    line-height: 1.7;

}


/* =====================================================
   スマホ
===================================================== */

@media (max-width: 600px) {

    body {
        padding: 5px;
    }

    .container {
        padding: 10px;
    }

    #sqrtQuestion {
        font-size: 25px;
    }

    #turnDisplay {
        font-size: 19px;
    }

    .decimal-label {
        font-size: 30px;
    }

    .digit-box {

        width: 44px;
        min-width: 44px;

        height: 50px;

        font-size: 28px;

        line-height: 46px;

        margin: 2px;

    }

    #squareDisplay {
        font-size: 21px;
    }

}

</style>

</head>


<body>

<div class="container">


<!-- =================================================
     スタート画面
================================================= -->

<div id="startScreen">

    <h1>√x</h1>


    <div class="center">

        <div class="mode-box">

            <h2>ゲームモード</h2>


            <label>
                <input
                    type="radio"
                    name="gameMode"
                    value="normal"
                    checked
                    onchange="updateModeOptions()"
                >

                ① 50点先取モード
            </label>

            <div class="mode-description">

                50点を先に取った人の勝ちとなります。
                （複数人でのプレイ推奨）

            </div>


            <label>

                <input
                    type="radio"
                    name="gameMode"
                    value="infinite"
                    onchange="updateModeOptions()"
                >

                ② 無限小数モード

            </label>

            <div class="mode-description">

                時間やスコアを気にせず、
                無限に小数を予測することができます。

            </div>


            <label>

                <input
                    type="radio"
                    name="gameMode"
                    value="time"
                    onchange="updateModeOptions()"
                >

                ③ タイムトライアル

            </label>

            <div class="mode-description">

                小数第七位までの値を
                「早く、正確に」予想してください。

            </div>


            <!-- 無限小数用 -->

            <div
                id="infiniteOptions"
                class="option-box hidden"
            >

                <label>

                    スコアシステム：

                    <select id="infiniteScoreMode">

                        <option value="on">
                            あり
                        </option>

                        <option value="off">
                            なし
                        </option>

                    </select>

                </label>

            </div>

        </div>


        <div class="mode-box">

            <h3>プレイヤー人数</h3>

            <label>

                プレイヤー人数：

                <select id="playerCount">

                    <option value="1" selected>
                        1人
                    </option>

                    <option value="2">
                        2人
                    </option>

                    <option value="3">
                        3人
                    </option>

                    <option value="4">
                        4人
                    </option>

                    <option value="5">
                        5人
                    </option>

                    <option value="6">
                        6人
                    </option>

                    <option value="7">
                        7人
                    </option>

                    <option value="8">
                        8人
                    </option>

                </select>

            </label>

        </div>


        <button onclick="startGame()">
            ゲーム開始
        </button>

    </div>

</div>


<!-- =================================================
     ゲーム画面
================================================= -->

<div id="gameScreen" class="hidden">


    <div id="gameArea">


        <h1>√x</h1>


        <div id="sqrtQuestion"></div>


        <div
            id="timerDisplay"
            class="hidden"
        >
        </div>


        <div id="turnDisplay"></div>


        <div id="overDisplay"></div>


        <div id="currentNumber"></div>


        <div id="squareDisplay"></div>


        <div
            id="warning"
            class="hidden"
        >
        </div>


        <button onclick="confirmTurn()">
            この桁を確定
        </button>


        <div id="message"></div>


        <div id="bonusLog"></div>


    </div>


    <h2
        id="scoreTitle"
        class="center"
    >
        ポイント
    </h2>


    <div id="playerTable"></div>


</div>


<!-- =================================================
     終了画面
================================================= -->

<div
    id="endScreen"
    class="hidden"
>

    <h1 id="endTitle">
        GAME CLEAR
    </h1>


    <div id="result"></div>


    <div class="center">

        <button onclick="location.reload()">
            もう一度遊ぶ
        </button>

    </div>

</div>


</div>


<script>

/* =====================================================
   プレイヤー
===================================================== */

class Player {

    constructor(number) {

        this.number = number;

        this.score = 0;

        this.eliminated = false;

    }

    name() {

        return "プレイヤー" + this.number;

    }

}


/* =====================================================
   桁
===================================================== */

class Digit {

    constructor(position) {

        this.position = position;

        this.value = null;

        this.filled = false;

        this.counter = 5;

        this.owner = null;

        this.noCorrectionNeeded = false;

    }

}


/* =====================================================
   ゲーム変数
===================================================== */

let x;

let sqrtX;

let integerPart;

let players = [];

let turnOrder = [];

let currentTurnIndex = 0;

let digits = [];

let gameStarted = false;

let gameMode = "normal";

let scoreEnabled = true;

let timerInterval = null;

let startTime = 0;

let elapsedSeconds = 0;

let timePenalty = 0;


/*
    タイムトライアルは7桁
    その他は10桁
*/

const NORMAL_MAX_DIGITS = 10;

const TIME_MAX_DIGITS = 7;


/* =====================================================
   モード選択
===================================================== */

function updateModeOptions() {

    const selected =
        document.querySelector(
            'input[name="gameMode"]:checked'
        ).value;


    const infiniteOptions =
        document.getElementById(
            "infiniteOptions"
        );


    if (
        selected === "infinite"
    ) {

        infiniteOptions
            .classList
            .remove("hidden");

    }

    else {

        infiniteOptions
            .classList
            .add("hidden");

    }

}


/* =====================================================
   ゲーム開始
===================================================== */

function startGame() {

    gameMode =
        document.querySelector(
            'input[name="gameMode"]:checked'
        ).value;


    if (
        gameMode === "infinite"
    ) {

        scoreEnabled =
            document
            .getElementById(
                "infiniteScoreMode"
            )
            .value === "on";

    }

    else {

        scoreEnabled = true;

    }


    const count =
        Number(
            document
            .getElementById(
                "playerCount"
            )
            .value
        );


    /*
        平方数を除外した
        1～1000
    */

    const candidates = [];


    for (
        let i = 1;
        i <= 1000;
        i++
    ) {

        if (
            !Number.isInteger(
                Math.sqrt(i)
            )
        ) {

            candidates.push(i);

        }

    }


    x =
        candidates[
            Math.floor(
                Math.random()
                *
                candidates.length
            )
        ];


    sqrtX =
        Math.sqrt(x);


    integerPart =
        Math.floor(sqrtX);


    /*
        プレイヤー
    */

    players = [];


    for (
        let i = 1;
        i <= count;
        i++
    ) {

        players.push(
            new Player(i)
        );

    }


    turnOrder =
        [...players];


    currentTurnIndex = 0;


    /*
        桁
    */

    digits = [];


    for (
        let i = 1;
        i <= NORMAL_MAX_DIGITS;
        i++
    ) {

        digits.push(
            new Digit(i)
        );

    }


    gameStarted = true;


    /*
        UI
    */

    document
        .getElementById("startScreen")
        .classList
        .add("hidden");


    document
        .getElementById("gameScreen")
        .classList
        .remove("hidden");


    document
        .getElementById("sqrtQuestion")
        .textContent =
            `√${x} = ？`;


    /*
        タイマー
    */

    if (
        gameMode === "infinite"
        ||
        gameMode === "time"
    ) {

        startTimer();

    }

    else {

        document
            .getElementById("timerDisplay")
            .classList
            .add("hidden");

    }


    /*
        タイムトライアルでは
        スコア表示を消す
    */

    if (
        gameMode === "time"
        ||
        (
            gameMode === "infinite"
            &&
            !scoreEnabled
        )
    ) {

        document
            .getElementById("scoreTitle")
            .classList
            .add("hidden");

        document
            .getElementById("playerTable")
            .classList
            .add("hidden");

    }

    else {

        document
            .getElementById("scoreTitle")
            .classList
            .remove("hidden");

        document
            .getElementById("playerTable")
            .classList
            .remove("hidden");

    }


    updateAll();


    if (
        gameMode === "time"
    ) {

        showMessage(
            "小数第1位から、7桁を正確に埋めてください。"
        );

    }

    else {

        showMessage(
            "小数第1位を予測してください。"
        );

    }

}


/* =====================================================
   タイマー
===================================================== */

function startTimer() {

    startTime =
        Date.now();

    elapsedSeconds = 0;

    timePenalty = 0;


    const timer =
        document.getElementById(
            "timerDisplay"
        );


    timer.classList.remove(
        "hidden"
    );


    if (
        timerInterval
    ) {

        clearInterval(
            timerInterval
        );

    }


    timerInterval =
        setInterval(
            updateTimer,
            100
        );


    updateTimer();

}


/* =====================================================
   タイマー更新
===================================================== */

function updateTimer() {

    if (
        !gameStarted
    ) {

        return;

    }


    elapsedSeconds =
        (
            Date.now()
            -
            startTime
        )
        /
        1000;


    const total =
        elapsedSeconds
        +
        timePenalty;


    document
        .getElementById("timerDisplay")
        .textContent =
            `TIME ${formatTime(total)}`;

}


/* =====================================================
   時間表示
===================================================== */

function formatTime(seconds) {

    return seconds
        .toFixed(1)
        .padStart(4, "0")
        + "秒";

}


/* =====================================================
   現在プレイヤー
===================================================== */

function currentPlayer() {

    return turnOrder[
        currentTurnIndex
    ];

}


/* =====================================================
   最大桁
===================================================== */

function getMaxDigits() {

    if (
        gameMode === "time"
    ) {

        return TIME_MAX_DIGITS;

    }

    return NORMAL_MAX_DIGITS;

}


/* =====================================================
   全体更新
===================================================== */

function updateAll() {

    updateTurn();

    updateNumber();

    updateSquare();

    updateWarning();

    updatePlayers();

}


/* =====================================================
   ターン表示
===================================================== */

function updateTurn() {

    /*
        プレイヤーが存在しない
        状態を防止
    */

    if (
        !currentPlayer()
    ) {

        return;

    }


    let safety = 0;


    while (
        currentPlayer().eliminated
        &&
        safety < turnOrder.length
    ) {

        currentTurnIndex =
            (
                currentTurnIndex + 1
            )
            %
            turnOrder.length;

        safety++;

    }


    /*
        タイムトライアルでは
        プレイヤー表示は残す
    */

    document
        .getElementById("turnDisplay")
        .textContent =
            currentPlayer().name()
            +
            " のターン";

}


/* =====================================================
   数字入力欄
===================================================== */

function updateNumber() {

    const area =
        document.getElementById(
            "currentNumber"
        );


    area.innerHTML = "";


    /*
        整数部分
    */

    const integer =
        document.createElement(
            "span"
        );


    integer.className =
        "decimal-label";


    integer.textContent =
        integerPart + ".";


    area.appendChild(
        integer
    );


    /*
        最後に埋まっている桁
    */

    let lastFilled = 0;


    for (
        let i = 0;
        i < digits.length;
        i++
    ) {

        if (
            digits[i].filled
        ) {

            lastFilled =
                i + 1;

        }
        else {

            break;

        }

    }


    /*
        次に追加できる
        空白1マス
    */

    const displayCount =
        Math.min(
            lastFilled + 1,
            getMaxDigits()
        );


    for (
        let i = 0;
        i < displayCount;
        i++
    ) {

        const digit =
            digits[i];


        const input =
            document.createElement(
                "input"
            );


        input.type = "text";

        input.inputMode =
            "numeric";

        input.maxLength = 1;

        input.className =
            "digit-box";

        input.dataset.position =
            digit.position;


        if (
            digit.filled
        ) {

            input.value =
                digit.value;

        }


        input.addEventListener(
            "input",
            function() {

                this.value =
                    this.value
                    .replace(
                        /[^0-9]/g,
                        ""
                    )
                    .slice(
                        0,
                        1
                    );

            }
        );


        area.appendChild(
            input
        );

    }

}


/* =====================================================
   現在の数値
===================================================== */

function getCurrentNumber() {

    let number =
        integerPart;


    for (
        let i = 0;
        i < digits.length;
        i++
    ) {

        if (
            digits[i].filled
        ) {

            number +=
                digits[i].value
                *
                Math.pow(
                    10,
                    -(i + 1)
                );

        }
        else {

            break;

        }

    }


    return number;

}


/* =====================================================
   表示用の数値
   不要な0を削る
===================================================== */

function formatNumber(number) {

    /*
        浮動小数点誤差を抑える
    */

    const fixed =
        number.toFixed(
            getMaxDigits()
        );


    return fixed
        .replace(
            /(\.\d*?[1-9])0+$/,
            "$1"
        )
        .replace(
            /\.0+$/,
            ""
        );

}


/* =====================================================
   二乗表示
===================================================== */

function updateSquare() {

    const number =
        getCurrentNumber();


    const square =
        number * number;


    const area =
        document.getElementById(
            "squareDisplay"
        );


    const numberText =
        formatNumber(number);


    const squareText =
        formatNumber(square);


    area.className =
        "";


    if (
        square > x
    ) {

        area.classList.add(
            "over"
        );

    }

    else {

        area.classList.add(
            "safe"
        );

    }


    area.innerHTML =
        `
        <div>
            現在の値：
            ${numberText}
        </div>

        <div>
            二乗：
            ${squareText}
        </div>
        `;

}


/* =====================================================
   カウント警告
===================================================== */

function updateWarning() {

    const area =
        document.getElementById(
            "warning"
        );


    const needsCorrection =
        digits.some(
            digit =>
                digit.filled
                &&
                !digit.noCorrectionNeeded
                &&
                digit.counter === 1
        );


    /*
        「対象：小数第○位」は
        表示しない
    */

    if (
        needsCorrection
    ) {

        area.classList.remove(
            "hidden"
        );


        area.textContent =
            "次のターンまでに修正しなければいけない位があります。";

    }

    else {

        area.classList.add(
            "hidden"
        );

    }

}


/* =====================================================
   プレイヤー表示
===================================================== */

function updatePlayers() {

    const area =
        document.getElementById(
            "playerTable"
        );


    area.innerHTML = "";


    players.forEach(
        player => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "player-card";


            if (
                player.eliminated
            ) {

                card.classList.add(
                    "eliminated"
                );

            }


            card.innerHTML =
                `
                <div class="player-number">
                    ${player.name()}
                </div>

                <div class="player-score">
                    ${player.score} pt
                </div>
                `;


            area.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   入力値取得
===================================================== */

function getInputValues() {

    const inputs =
        document.querySelectorAll(
            "#currentNumber .digit-box"
        );


    const result = [];


    inputs.forEach(
        input => {

            result.push({

                position:
                    Number(
                        input.dataset.position
                    ),

                value:
                    input.value === ""
                    ? null
                    : Number(
                        input.value
                    )

            });

        }
    );


    return result;

}


/* =====================================================
   ターン確定
===================================================== */

function confirmTurn() {

    if (
        !gameStarted
    ) {

        return;

    }


    const inputs =
        getInputValues();


    /*
        現在の最後の桁
    */

    let lastFilledPosition = 0;


    for (
        let i = 0;
        i < digits.length;
        i++
    ) {

        if (
            digits[i].filled
        ) {

            lastFilledPosition =
                i + 1;

        }
        else {

            break;

        }

    }


    /*
        変更一覧
    */

    const changed = [];


    inputs.forEach(
        item => {

            const digit =
                digits[
                    item.position - 1
                ];


            if (
                !digit
            ) {

                return;

            }


            const oldValue =
                digit.value;


            if (
                item.value !== oldValue
            ) {

                changed.push({

                    digit:
                        digit,

                    newValue:
                        item.value,

                    oldValue:
                        oldValue

                });

            }

        }
    );


    if (
        changed.length === 0
    ) {

        showMessage(
            "数字を1つ以上変更してください。"
        );

        return;

    }


    changed.sort(
        (a,b) =>
            a.digit.position
            -
            b.digit.position
    );


    const highestChanged =
        changed[0];


    const highestPosition =
        highestChanged
            .digit
            .position;


    const isNewDigit =
        !highestChanged
            .digit
            .filled;


    /*
        ================================================
        新しい桁の追加
        ================================================
    */

    if (
        isNewDigit
    ) {

        /*
            新しい桁は
            最後の空白1つだけ
        */

        if (
            highestPosition
            !==
            lastFilledPosition + 1
        ) {

            showMessage(
                "桁は1つずつ追加してください。"
            );

            updateAll();

            return;

        }


        /*
            新しい桁と同時に
            下位桁を変更不可
        */

        for (
            const change of changed
        ) {

            if (
                change.digit.position
                >
                highestPosition
            ) {

                showMessage(
                    "新しい桁は1ターンにつき1つだけ追加できます。"
                );

                updateAll();

                return;

            }

        }

    }


    /*
        ================================================
        訂正
        ================================================
    */

    else {

        for (
            const change of changed
        ) {

            const position =
                change.digit.position;


            /*
                訂正した桁より
                上位は変更不可
            */

            if (
                position
                <
                highestPosition
            ) {

                showMessage(
                    "訂正した桁より上位の桁は変更できません。"
                );

                updateAll();

                return;

            }


            /*
                既存の最後＋空白1マス
                まで
            */

            if (
                position
                >
                lastFilledPosition + 1
            ) {

                showMessage(
                    "一度に追加できる新しい桁は1つだけです。"
                );

                updateAll();

                return;

            }

        }

    }


    /*
        ================================================
        空白にする
        ================================================
    */

    for (
        const change of changed
    ) {

        if (
            change.newValue === null
        ) {

            /*
                最後の既存桁のみ
                空白化可能
            */

            if (
                change.digit.position
                !==
                lastFilledPosition
            ) {

                showMessage(
                    "空白にできるのは最後の桁だけです。"
                );

                updateAll();

                return;

            }

        }

    }


    /*
        ================================================
        状態保存
        ================================================
    */

    const oldStates =
        changed.map(
            change => ({

                digit:
                    change.digit,

                value:
                    change.digit.value,

                filled:
                    change.digit.filled,

                counter:
                    change.digit.counter,

                owner:
                    change.digit.owner,

                noCorrectionNeeded:
                    change.digit
                        .noCorrectionNeeded

            })
        );


    /*
        ================================================
        仮変更
        ================================================
    */

    changed.forEach(
        change => {

            change.digit.value =
                change.newValue;


            if (
                change.newValue === null
            ) {

                change.digit.filled =
                    false;

                change.digit.owner =
                    null;

                change.digit.counter =
                    5;

                change.digit
                    .noCorrectionNeeded =
                    false;

            }

            else {

                change.digit.filled =
                    true;

            }

        }
    );


    /*
        ================================================
        数値
        ================================================
    */

    const oldNumber =
        getNumberFromStates(
            oldStates
        );


    const newNumber =
        getCurrentNumber();


    /*
        ================================================
        タイムトライアル
        オーバー判定
        ================================================
    */

    if (
        gameMode === "time"
        &&
        newNumber * newNumber > x
    ) {

        restoreStates(
            oldStates
        );


        timePenalty += 15;


        showOver();


        updateAll();


        /*
            オーバーしても
            ゲーム終了しない
        */

        return;

    }


    /*
        ================================================
        通常モードの
        訂正値判定
        ================================================
    */

    if (
        !isNewDigit
        &&
        newNumber <= oldNumber
    ) {

        /*
            タイムトライアルでは
            「オーバー」以外は
            正しい順序を要求
        */

        restoreStates(
            oldStates
        );


        showMessage(
            "訂正後の値は、訂正前の値より大きくしてください。"
        );


        updateAll();

        return;

    }


    /*
        ================================================
        二乗判定
        ================================================
    */

    const square =
        newNumber * newNumber;


    if (
        square > x
    ) {

        restoreStates(
            oldStates
        );


        /*
            タイムトライアルなら
            ここには来ない
        */

        currentPlayer()
            .eliminated =
            true;


        alert(
            `${currentPlayer().name()}は失格です。\n\n`
            +
            `宣言値：${formatNumber(newNumber)}\n`
            +
            `二乗：${formatNumber(square)}\n`
            +
            `x：${x}`
        );


        if (
            checkElimination()
        ) {

            return;

        }


        nextTurn();


        updateAll();

        return;

    }


    /*
        ================================================
        成功
        ================================================
    */

    const player =
        currentPlayer();


    /*
        ================================================
        ポイント
        ================================================
    */

    if (
        scoreEnabled
    ) {

        let point =
            highestChanged.newValue;


        if (
            point === null
        ) {

            point = 0;

        }


        player.score +=
            point;

    }


    /*
        所有者
    */

    if (
        highestChanged.newValue
        !== null
    ) {

        highestChanged
            .digit
            .owner =
            player;

    }


    /*
        ================================================
        新規桁
        ================================================
    */

    if (
        isNewDigit
    ) {

        highestChanged
            .digit
            .counter =
            5;

        highestChanged
            .digit
            .noCorrectionNeeded =
            false;

    }


    /*
        ================================================
        訂正
        ================================================
    */

    if (
        !isNewDigit
    ) {

        const oldValue =
            highestChanged.oldValue;


        const newValue =
            highestChanged.newValue;


        /*
            訂正した桁を5へ
        */

        highestChanged
            .digit
            .counter =
            5;


        highestChanged
            .digit
            .noCorrectionNeeded =
            false;


        /*
            +5以上なら
            大幅修正ボーナス
        */

        if (
            scoreEnabled
            &&
            newValue !== null
            &&
            oldValue !== null
            &&
            newValue - oldValue >= 5
        ) {

            player.score += 2;


            document
                .getElementById(
                    "bonusLog"
                )
                .textContent =
                    `（${player.name()}、大幅修正ボーナス獲得）`;

        }


        /*
            全体カウント+2
        */

        boostAllCounters(
            highestChanged.digit
        );

    }


    /*
        ================================================
        空白になった桁
        ================================================
    */

    changed.forEach(
        change => {

            const digit =
                change.digit;


            if (
                digit
                !==
                highestChanged.digit
            ) {

                if (
                    change.newValue === null
                ) {

                    digit.filled =
                        false;

                    digit.value =
                        null;

                    digit.counter =
                        5;

                    digit.owner =
                        null;

                    digit.noCorrectionNeeded =
                        false;

                }

            }

        }
    );


    /*
        ================================================
        訂正不要状態
        ================================================
    */

    updateCorrectionStates();


    /*
        ================================================
        タイムトライアル
        7桁完成判定
        ================================================
    */

    if (
        gameMode === "time"
    ) {

        if (
            isSevenDigitsCorrect()
        ) {

            endGame(
                "小数第七位まで正確に予測しました。",
                true
            );

            return;

        }

    }


    /*
        ================================================
        50点先取
        ================================================
    */

    if (
        gameMode === "normal"
        &&
        player.score >= 50
    ) {

        endGame(
            `${player.name()}が50点を先取しました。`,
            true
        );

        return;

    }


    /*
        ================================================
        通常モード10桁終了
        ================================================
    */

    if (
        gameMode === "normal"
        &&
        digits[9].filled
    ) {

        endGame(
            "小数10桁目に到達しました。",
            true
        );

        return;

    }


    /*
        ================================================
        カウント減少
        ================================================
    */

    advanceCounters(
        highestChanged.digit
    );


    /*
        ================================================
        カウント0
        ================================================
    */

    if (
        checkCounterZero()
    ) {

        return;

    }


    /*
        ================================================
        次のターン
        ================================================
    */

    nextTurn();


    updateAll();


    if (
        isNewDigit
    ) {

        showMessage(
            `${player.name()}が`
            +
            `小数第${highestPosition}位を宣言しました。`
        );

    }

    else {

        showMessage(
            `${player.name()}が`
            +
            `小数第${highestPosition}位を訂正しました。`
        );

    }

}


/* =====================================================
   7桁が正確か
===================================================== */

function isSevenDigitsCorrect() {

    if (
        !digits[6].filled
    ) {

        return false;

    }


    /*
        √xを7桁で切り捨てた値
    */

    const expected =
        Math.floor(
            sqrtX * 10000000
        )
        /
        10000000;


    /*
        現在値を整数化して比較
    */

    const actualInteger =
        Math.round(
            getCurrentNumber()
            *
            10000000
        );


    const expectedInteger =
        Math.floor(
            sqrtX * 10000000
        );


    return (
        actualInteger
        ===
        expectedInteger
    );

}


/* =====================================================
   過去状態から数値
===================================================== */

function getNumberFromStates(
    states
) {

    const stateMap =
        new Map();


    states.forEach(
        state => {

            stateMap.set(
                state.digit.position,
                state
            );

        }
    );


    let number =
        integerPart;


    for (
        let i = 0;
        i < digits.length;
        i++
    ) {

        const digit =
            digits[i];


        let value;


        if (
            stateMap.has(
                digit.position
            )
        ) {

            value =
                stateMap
                    .get(
                        digit.position
                    )
                    .value;

        }

        else {

            value =
                digit.value;

        }


        if (
            value !== null
            &&
            value !== undefined
        ) {

            number +=
                value
                *
                Math.pow(
                    10,
                    -(i + 1)
                );

        }

        else {

            break;

        }

    }


    return number;

}


/* =====================================================
   状態復元
===================================================== */

function restoreStates(
    states
) {

    states.forEach(
        state => {

            state.digit.value =
                state.value;

            state.digit.filled =
                state.filled;

            state.digit.counter =
                state.counter;

            state.digit.owner =
                state.owner;

            state.digit
                .noCorrectionNeeded =
                state.noCorrectionNeeded;

        }
    );

}


/* =====================================================
   全体カウント+2
===================================================== */

function boostAllCounters(
    correctedDigit
) {

    digits.forEach(
        digit => {

            if (
                !digit.filled
            ) {

                return;

            }


            if (
                digit.noCorrectionNeeded
            ) {

                return;

            }


            if (
                digit === correctedDigit
            ) {

                return;

            }


            digit.counter =
                Math.min(
                    5,
                    digit.counter + 2
                );

        }
    );


    correctedDigit.counter =
        5;

}


/* =====================================================
   訂正不要状態更新
===================================================== */

function updateCorrectionStates() {

    digits.forEach(
        digit => {

            checkNoCorrectionNeeded(
                digit
            );

        }
    );

}


/* =====================================================
   訂正不要判定
===================================================== */

function checkNoCorrectionNeeded(
    digit
) {

    if (
        !digit.filled
    ) {

        digit.noCorrectionNeeded =
            false;

        return;

    }


    /*
        9ならその桁は
        これ以上増やせない
    */

    if (
        digit.value === 9
    ) {

        digit.noCorrectionNeeded =
            true;

        return;

    }


    const number =
        getCurrentNumber();


    const amount =
        Math.pow(
            10,
            -digit.position
        );


    const increased =
        number + amount;


    /*
        +1すると√xを超えるなら
        その桁を修正する必要なし
    */

    if (
        increased * increased
        >
        x
    ) {

        digit.noCorrectionNeeded =
            true;

    }

    else {

        digit.noCorrectionNeeded =
            false;

    }

}


/* =====================================================
   カウント減少
===================================================== */

function advanceCounters(
    resetDigit
) {

    digits.forEach(
        digit => {

            if (
                !digit.filled
            ) {

                return;

            }


            if (
                digit === resetDigit
            ) {

                return;

            }


            if (
                digit.noCorrectionNeeded
            ) {

                return;

            }


            if (
                digit.counter > 0
            ) {

                digit.counter--;

            }

        }
    );

}


/* =====================================================
   カウント0
===================================================== */

function checkCounterZero() {

    for (
        const digit of digits
    ) {

        if (
            digit.filled
            &&
            !digit.noCorrectionNeeded
            &&
            digit.counter <= 0
        ) {

            endGame(
                `小数第${digit.position}位の値が5ターンの間修正されませんでした。`,
                false
            );


            return true;

        }

    }


    return false;

}


/* =====================================================
   次のターン
===================================================== */

function nextTurn() {

    let safety = 0;


    do {

        currentTurnIndex =
            (
                currentTurnIndex + 1
            )
            %
            turnOrder.length;

        safety++;

    }

    while (
        currentPlayer().eliminated
        &&
        safety <= turnOrder.length
    );

}


/* =====================================================
   失格チェック
===================================================== */

function checkElimination() {

    const alive =
        players.filter(
            player =>
                !player.eliminated
        );


    /*
        誰も残っていない
    */

    if (
        alive.length === 0
    ) {

        endGame(
            "全員が失格になりました。",
            false
        );

        return true;

    }


    /*
        1人だけ残った場合も
        ゲームオーバー
    */

    if (
        alive.length === 1
    ) {

        endGame(
            `${alive[0].name()}以外が全員失格になりました。`,
            false
        );

        return true;

    }


    return false;

}


/* =====================================================
   オーバー表示
===================================================== */

function showOver() {

    const area =
        document.getElementById(
            "overDisplay"
        );


    area.textContent =
        "オーバー！";


    /*
        1.5秒後に消す
    */

    setTimeout(
        () => {

            if (
                area.textContent ===
                "オーバー！"
            ) {

                area.textContent =
                    "";

            }

        },
        1500
    );

}


/* =====================================================
   メッセージ
===================================================== */

function showMessage(
    text
) {

    document
        .getElementById("message")
        .textContent =
            text;

}


/* =====================================================
   ゲーム終了
===================================================== */

function endGame(
    reason,
    clear
) {

    gameStarted = false;


    if (
        timerInterval
    ) {

        clearInterval(
            timerInterval
        );

        timerInterval = null;

    }


    /*
        タイマー最終値
    */

    const finalTime =
        elapsedSeconds
        +
        timePenalty;


    /*
        生存者のみを勝者候補にする
    */

    const alive =
        players.filter(
            player =>
                !player.eliminated
        );


    let winner = null;


    if (
        alive.length > 0
    ) {

        if (
            scoreEnabled
        ) {

            alive.sort(
                (a,b) =>
                    b.score - a.score
            );

        }

        winner =
            alive[0];

    }


    /*
        タイムトライアル
    */

    if (
        gameMode === "time"
    ) {

        clear =
            clear === true;

    }


    const title =
        document.getElementById(
            "endTitle"
        );


    title.textContent =
        clear
        ? "GAME CLEAR"
        : "GAME OVER";


    /*
        最終値
    */

    const finalNumber =
        formatNumber(
            getCurrentNumber()
        );


    const exact =
        sqrtX.toFixed(12);


    let html = "";


    if (
        winner
    ) {

        html +=
            `<h2>🏆 ${winner.name()}</h2>`;

    }


    html +=
        `<p>${reason}</p>`;


    html +=
        `
        <p>
            √${x} =
            ${exact}
            <br>
            最終予測値 =
            ${finalNumber}
        </p>
        `;


    /*
        タイムトライアル
    */

    if (
        gameMode === "time"
    ) {

        html +=
            `
            <h2>
                最終タイム
            </h2>

            <p>
                ${formatTime(finalTime)}
            </p>
            `;

    }


    /*
        スコア表示
    */

    if (
        scoreEnabled
    ) {

        html +=
            `<h2>最終ポイント</h2>`;


        const ranking =
            [...players]
            .sort(
                (a,b) => {

                    /*
                        失格者は必ず下
                    */

                    if (
                        a.eliminated
                        &&
                        !b.eliminated
                    ) {

                        return 1;

                    }

                    if (
                        !a.eliminated
                        &&
                        b.eliminated
                    ) {

                        return -1;

                    }

                    return (
                        b.score
                        -
                        a.score
                    );

                }
            );


        ranking.forEach(
            (player,index) => {

                html +=
                    `
                    <p>
                        ${index + 1}位　
                        ${player.name()}　
                        ${player.score}pt
                        ${
                            player.eliminated
                            ? "（失格）"
                            : ""
                        }
                    </p>
                    `;

            }
        );

    }


    document
        .getElementById("gameScreen")
        .classList
        .add("hidden");


    document
        .getElementById("endScreen")
        .classList
        .remove("hidden");


    document
        .getElementById("result")
        .innerHTML =
            html;

}

</script>
