<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>√x</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 10px;
    background: #f2f2f2;
    color: #222;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 15px;
    background: white;
    border-radius: 15px;
    box-shadow:
        0 3px 12px
        rgba(0,0,0,0.15);
}

h1 {
    text-align: center;
    margin: 5px 0 15px;
}

.center {
    text-align: center;
}

.hidden {
    display: none !important;
}

button {
    padding: 11px 18px;
    margin: 5px;
    font-size: 17px;
    background: white;
    border: 1px solid #888;
    border-radius: 8px;
}

button:active {
    transform: scale(0.97);
}

select {
    padding: 8px;
    font-size: 18px;
}


/* ================================
   ゲーム画面
================================ */

#gameArea {
    padding: 15px;
    text-align: center;
    background: #fafafa;
    border: 2px solid #444;
    border-radius: 12px;
}

#sqrtQuestion {
    font-size: 28px;
    font-weight: bold;
}

#turnDisplay {
    margin-top: 18px;
    font-size: 21px;
    font-weight: bold;
}


/* ================================
   現在の数字
================================ */

#currentNumber {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 20px 0;
    padding: 8px 5px;
    overflow-x: auto;
    white-space: nowrap;
    -webkit-overflow-scrolling: touch;
}

.decimal-label {
    flex-shrink: 0;
    font-family: monospace;
    font-size: 34px;
    font-weight: bold;
}


/* ================================
   数字入力
================================ */

.digit-box {
    flex-shrink: 0;

    width: 48px;
    min-width: 48px;

    height: 54px;

    margin: 3px;
    padding: 0;

    text-align: center;

    font-family: monospace;

    font-size: 30px;

    line-height: 50px;

    border: 2px solid #777;
    border-radius: 6px;

    background: white;
}

.digit-box:focus {
    outline: none;
    border: 3px solid #333;
}


/* ================================
   二乗表示
================================ */

#squareDisplay {
    margin-top: 15px;
    padding: 15px;

    background: #eaeaea;

    border-radius: 8px;

    font-size: 26px;
    font-weight: bold;

    line-height: 1.7;
}


/* ================================
   カウント警告
================================ */

#warning {
    margin-top: 15px;
    padding: 12px;

    background: #fff7d6;

    border: 2px solid #d6a900;

    border-radius: 8px;

    color: #765900;

    font-weight: bold;

    white-space: pre-line;
}


/* ================================
   メッセージ
================================ */

#message {
    margin-top: 15px;
    padding: 10px;
    background: #eee;
    border-radius: 8px;
}


/* ================================
   ボーナス
================================ */

#bonusLog {
    min-height: 25px;
    margin-top: 15px;
    font-weight: bold;
}


/* ================================
   ポイント表
================================ */

#playerTable {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;

    gap: 10px;

    margin-top: 15px;
}

.player-card {
    width: 115px;
    min-height: 75px;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    background: white;

    border: 2px solid #555;

    border-radius: 10px;
}

.player-number {
    font-size: 17px;
    font-weight: bold;
}

.player-score {
    margin-top: 5px;
    font-size: 24px;
}

.player-card.eliminated {
    opacity: 0.4;
    text-decoration: line-through;
}


/* ================================
   結果
================================ */

#result {
    font-size: 18px;
    line-height: 1.7;
}


/* ================================
   スマホ
================================ */

@media (max-width: 600px) {

    body {
        padding: 5px;
    }

    .container {
        padding: 10px;
    }

    #sqrtQuestion {
        font-size: 25px;
    }

    #turnDisplay {
        font-size: 19px;
    }

    .decimal-label {
        font-size: 30px;
    }

    .digit-box {
        width: 44px;
        min-width: 44px;

        height: 50px;

        font-size: 28px;

        line-height: 46px;

        margin: 2px;
    }

    #squareDisplay {
        font-size: 23px;
    }

}

</style>

</head>


<body>

<div class="container">


<!-- ================================
     スタート画面
================================ -->

<div id="startScreen">

    <h1>√x</h1>

    <div class="center">

        <p>
            √xの値を1桁ずつ予測するゲームです。
        </p>

        <p>
            予測した桁の値だけ、ポイントが入ります。
        </p>

        <p>
            <strong>50点先取です。</strong>
        </p>

        <br>

        <label>
            プレイヤー人数：
        </label>

        <select id="playerCount">

            <option value="1" selected>
                1人
            </option>

            <option value="2">
                2人
            </option>

            <option value="3">
                3人
            </option>

            <option value="4">
                4人
            </option>

            <option value="5">
                5人
            </option>

            <option value="6">
                6人
            </option>

            <option value="7">
                7人
            </option>

            <option value="8">
                8人
            </option>

        </select>

        <br><br>

        <button onclick="startGame()">
            ゲーム開始
        </button>

    </div>

</div>


<!-- ================================
     ゲーム画面
================================ -->

<div id="gameScreen" class="hidden">

    <div id="gameArea">

        <h1>√x</h1>

        <div id="sqrtQuestion"></div>

        <div id="turnDisplay"></div>

        <div id="currentNumber"></div>

        <div id="squareDisplay"></div>

        <div id="warning"
             class="hidden">
        </div>

        <button onclick="confirmTurn()">
            この桁を確定
        </button>

        <div id="message"></div>

        <div id="bonusLog"></div>

    </div>


    <h2 class="center">
        ポイント
    </h2>

    <div id="playerTable"></div>

</div>


<!-- ================================
     終了画面
================================ -->

<div id="endScreen"
     class="hidden">

    <h1 id="endTitle">
        GAME CLEAR
    </h1>

    <div id="result"></div>

    <div class="center">

        <button onclick="location.reload()">
            もう一度遊ぶ
        </button>

    </div>

</div>

</div>


<script>


/* =====================================================
   プレイヤークラス
===================================================== */

class Player {

    constructor(number) {

        this.number = number;

        this.score = 0;

        this.eliminated = false;

    }

    name() {

        return "プレイヤー" + this.number;

    }

}


/* =====================================================
   桁クラス
===================================================== */

class Digit {

    constructor(position) {

        this.position = position;

        this.value = null;

        this.filled = false;

        this.counter = 5;

        this.owner = null;

        this.noCorrectionNeeded = false;

    }

}


/* =====================================================
   ゲーム変数
===================================================== */

let x;

let sqrtX;

let integerPart;

let players = [];

let turnOrder = [];

let currentTurnIndex = 0;

let digits = [];

let gameStarted = false;


/* =====================================================
   数値表示用
   浮動小数点誤差を除去
===================================================== */

function cleanNumber(number, digitsAfterDecimal = 12) {

    return Number(
        number.toFixed(digitsAfterDecimal)
    );

}


/* =====================================================
   ゲーム開始
===================================================== */

function startGame() {

    const count =
        Number(
            document
            .getElementById("playerCount")
            .value
        );


    const candidates = [];


    for (
        let i = 1;
        i <= 1000;
        i++
    ) {

        if (
            !Number.isInteger(
                Math.sqrt(i)
            )
        ) {

            candidates.push(i);

        }

    }


    x =
        candidates[
            Math.floor(
                Math.random()
                *
                candidates.length
            )
        ];


    sqrtX =
        Math.sqrt(x);


    integerPart =
        Math.floor(sqrtX);


    players = [];


    for (
        let i = 1;
        i <= count;
        i++
    ) {

        players.push(
            new Player(i)
        );

    }


    turnOrder =
        [...players];


    currentTurnIndex = 0;


    digits = [];


    for (
        let i = 1;
        i <= 10;
        i++
    ) {

        digits.push(
            new Digit(i)
        );

    }


    gameStarted = true;


    document
    .getElementById("startScreen")
    .classList
    .add("hidden");


    document
    .getElementById("gameScreen")
    .classList
    .remove("hidden");


    document
    .getElementById("sqrtQuestion")
    .textContent =
        `√${x} = ？`;


    document
    .getElementById("bonusLog")
    .textContent = "";


    updateAll();


    showMessage(
        "小数第1位を予測してください。"
    );

}


/* =====================================================
   現在のプレイヤー
===================================================== */

function currentPlayer() {

    return turnOrder[currentTurnIndex];

}


/* =====================================================
   全体更新
===================================================== */

function updateAll() {

    updateTurn();

    updateNumber();

    updateSquare();

    updateWarning();

    updatePlayers();

}


/* =====================================================
   ターン表示
===================================================== */

function updateTurn() {

    let safety = 0;


    while (
        currentPlayer().eliminated
        &&
        safety < turnOrder.length
    ) {

        currentTurnIndex =
            (
                currentTurnIndex + 1
            )
            %
            turnOrder.length;

        safety++;

    }


    document
    .getElementById("turnDisplay")
    .textContent =
        currentPlayer().name()
        +
        " のターン";

}


/* =====================================================
   数字入力欄
===================================================== */

function updateNumber() {

    const area =
        document
        .getElementById("currentNumber");


    area.innerHTML = "";


    const integer =
        document.createElement("span");


    integer.className =
        "decimal-label";


    integer.textContent =
        integerPart + ".";


    area.appendChild(integer);


    let lastFilled = 0;


    for (
        let i = 0;
        i < digits.length;
        i++
    ) {

        if (
            digits[i].filled
        ) {

            lastFilled =
                i + 1;

        }
        else {

            break;

        }

    }


    const displayCount =
        Math.min(
            lastFilled + 1,
            10
        );


    for (
        let i = 0;
        i < displayCount;
        i++
    ) {

        const digit =
            digits[i];


        const input =
            document.createElement("input");


        input.type =
            "text";


        input.inputMode =
            "numeric";


        input.maxLength =
            1;


        input.className =
            "digit-box";


        input.dataset.position =
            digit.position;


        if (
            digit.filled
        ) {

            input.value =
                digit.value;

        }


        input.addEventListener(
            "input",
            function() {

                this.value =
                    this.value
                    .replace(
                        /[^0-9]/g,
                        ""
                    )
                    .slice(
                        0,
                        1
                    );

            }
        );


        area.appendChild(input);

    }

}


/* =====================================================
   現在の数値
===================================================== */

function getCurrentNumber() {

    let number =
        integerPart;


    for (
        let i = 0;
        i < digits.length;
        i++
    ) {

        if (
            digits[i].filled
        ) {

            number +=
                digits[i].value
                *
                Math.pow(
                    10,
                    -(i + 1)
                );

        }
        else {

            break;

        }

    }


    return cleanNumber(
        number,
        12
    );

}


/* =====================================================
   二乗表示
===================================================== */

function updateSquare() {

    const number =
        getCurrentNumber();


    const square =
        cleanNumber(
            number * number,
            12
        );


    const area =
        document
        .getElementById("squareDisplay");


    area.className = "";


    area.innerHTML =
        `
        <div>
            現在の値：
            ${number.toFixed(10)}
        </div>

        <div>
            二乗：
            ${square.toFixed(10)}
        </div>
        `;

}


/* =====================================================
   カウント警告
===================================================== */

function updateWarning() {

    const area =
        document
        .getElementById("warning");


    const warnings = [];


    digits.forEach(
        digit => {

            if (
                digit.filled
                &&
                !digit.noCorrectionNeeded
                &&
                digit.counter === 1
            ) {

                warnings.push(
                    `小数第${digit.position}位`
                );

            }

        }
    );


    if (
        warnings.length > 0
    ) {

        area.classList.remove(
            "hidden"
        );


        area.textContent =
            "このターンで修正しなければいけない値があります。"
            +
            "もし失敗した場合、強制終了となります。"
            +
            "\n対象："
            +
            warnings.join("、");

    }

    else {

        area.classList.add(
            "hidden"
        );

    }

}


/* =====================================================
   ポイント表
===================================================== */

function updatePlayers() {

    const area =
        document
        .getElementById("playerTable");


    area.innerHTML = "";


    players.forEach(
        player => {

            const card =
                document.createElement("div");


            card.className =
                "player-card";


            if (
                player.eliminated
            ) {

                card.classList.add(
                    "eliminated"
                );

            }


            card.innerHTML =
                `
                <div class="player-number">
                    ${player.name()}
                </div>

                <div class="player-score">
                    ${player.score} pt
                </div>
                `;


            area.appendChild(card);

        }
    );

}


/* =====================================================
   入力値取得
===================================================== */

function getInputValues() {

    const inputs =
        document.querySelectorAll(
            "#currentNumber .digit-box"
        );


    const result = [];


    inputs.forEach(
        input => {

            result.push({

                position:
                    Number(
                        input.dataset.position
                    ),

                value:
                    input.value === ""
                    ? null
                    : Number(
                        input.value
                    )

            });

        }
    );


    return result;

}


/* =====================================================
   ターン確定
===================================================== */

function confirmTurn() {

    if (
        !gameStarted
    ) {

        return;

    }


    const inputs =
        getInputValues();


    let lastFilledPosition = 0;


    for (
        let i = 0;
        i < digits.length;
        i++
    ) {

        if (
            digits[i].filled
        ) {

            lastFilledPosition =
                i + 1;

        }
        else {

            break;

        }

    }


    const changed = [];


    inputs.forEach(
        item => {

            const digit =
                digits[
                    item.position - 1
                ];


            const oldValue =
                digit.value;


            if (
                item.value !== oldValue
            ) {

                changed.push({

                    digit: digit,

                    newValue:
                        item.value,

                    oldValue:
                        oldValue

                });

            }

        }
    );


    if (
        changed.length === 0
    ) {

        showMessage(
            "数字を1つ以上変更してください。"
        );

        return;

    }


    changed.sort(
        (a, b) =>
            a.digit.position
            -
            b.digit.position
    );


    const highestChanged =
        changed[0];


    const highestPosition =
        highestChanged
        .digit
        .position;


    const isNewDigit =
        !highestChanged
        .digit
        .filled;


    /* ================================================
       新しい桁
    ================================================ */

    if (
        isNewDigit
    ) {

        if (
            highestPosition
            !==
            lastFilledPosition + 1
        ) {

            showMessage(
                "桁は1つずつ追加してください。"
            );

            updateAll();

            return;

        }


        /*
            新しい桁を追加する場合、
            変更できるのは空白の1マスだけ
        */

        if (
            changed.length !== 1
        ) {

            showMessage(
                "新しい桁を追加する場合、変更できるのはその1桁だけです。"
            );

            updateAll();

            return;

        }

    }


    /* ================================================
       訂正
    ================================================ */

    else {

        /*
            最上位の変更桁より上位は
            変更不可
        */

        for (
            const change of changed
        ) {

            if (
                change.digit.position
                <
                highestPosition
            ) {

                showMessage(
                    "訂正した桁より上位の桁は変更できません。"
                );

                updateAll();

                return;

            }


            /*
                現在の最後の桁より
                1つ下までなら変更可能
            */

            if (
                change.digit.position
                >
                lastFilledPosition + 1
            ) {

                showMessage(
                    "一度に追加できる新しい桁は1つだけです。"
                );

                updateAll();

                return;

            }

        }

    }


    /* ================================================
       空白にする場合
    ================================================ */

    for (
        const change of changed
    ) {

        if (
            change.newValue === null
        ) {

            /*
                空白にできるのは
                最後に存在している桁だけ
            */

            if (
                change.digit.position
                !==
                lastFilledPosition
            ) {

                showMessage(
                    "空白にできるのは最後の桁だけです。"
                );

                updateAll();

                return;

            }

        }

    }


    /* ================================================
       状態保存
    ================================================ */

    const oldStates =
        changed.map(
            change => ({

                digit:
                    change.digit,

                value:
                    change.digit.value,

                filled:
                    change.digit.filled,

                counter:
                    change.digit.counter,

                owner:
                    change.digit.owner,

                noCorrectionNeeded:
                    change.digit
                    .noCorrectionNeeded

            })
        );


    /* ================================================
       一時変更
    ================================================ */

    changed.forEach(
        change => {

            change.digit.value =
                change.newValue;


            if (
                change.newValue === null
            ) {

                change.digit.filled =
                    false;

                change.digit.owner =
                    null;

            }

            else {

                change.digit.filled =
                    true;

            }

        }
    );


    const oldNumber =
        getNumberFromStates(
            oldStates
        );


    const newNumber =
        getCurrentNumber();


    /* ================================================
       訂正後は元より大きく
    ================================================ */

    if (
        !isNewDigit
        &&
        newNumber <= oldNumber
    ) {

        restoreStates(
            oldStates
        );


        showMessage(
            "訂正後の値は、訂正前の値より大きくしてください。"
        );


        updateAll();

        return;

    }


    /* ================================================
       二乗判定
    ================================================ */

    const square =
        cleanNumber(
            newNumber * newNumber,
            12
        );


    if (
        square > x
    ) {

        restoreStates(
            oldStates
        );


        const failedPlayer =
            currentPlayer();


        failedPlayer.eliminated =
            true;


        alert(
            `${failedPlayer.name()}は失格です。\n\n`
            +
            `宣言値：${newNumber.toFixed(10)}\n`
            +
            `二乗：${square.toFixed(10)}\n`
            +
            `x：${x}`
        );


        if (
            checkElimination()
        ) {

            return;

        }


        nextTurn();

        updateAll();

        showMessage(
            `${failedPlayer.name()}が失格しました。`
        );

        return;

    }


    /* ================================================
       成功
    ================================================ */

    const player =
        currentPlayer();


    /*
        最上位の変更桁の値だけ
        ポイントとして加算
    */

    let point =
        highestChanged.newValue;


    if (
        point === null
    ) {

        point = 0;

    }


    player.score +=
        point;


    if (
        highestChanged.newValue
        !== null
    ) {

        highestChanged
            .digit
            .owner =
            player;

    }


    /* ================================================
       新規桁
    ================================================ */

    if (
        isNewDigit
    ) {

        highestChanged
            .digit
            .counter =
            5;

        highestChanged
            .digit
            .noCorrectionNeeded =
            false;

    }


    /* ================================================
       訂正
    ================================================ */

    if (
        !isNewDigit
    ) {

        const oldValue =
            highestChanged.oldValue;


        const newValue =
            highestChanged.newValue;


        highestChanged
            .digit
            .counter =
            5;


        highestChanged
            .digit
            .noCorrectionNeeded =
            false;


        /*
            大幅修正ボーナス
        */

        if (
            newValue !== null
            &&
            oldValue !== null
            &&
            newValue - oldValue >= 5
        ) {

            player.score += 2;


            document
            .getElementById("bonusLog")
            .textContent =
                `（${player.name()}、大幅修正ボーナス獲得）`;

        }


        /*
            訂正した場合、
            他の進行中のカウントを+2
            最大5
        */

        boostAllCounters(
            highestChanged.digit
        );

    }


    /* ================================================
       空白になった桁
    ================================================ */

    changed.forEach(
        change => {

            const digit =
                change.digit;


            if (
                digit
                !==
                highestChanged.digit
            ) {

                if (
                    change.newValue
                    === null
                ) {

                    digit.filled =
                        false;

                    digit.value =
                        null;

                    digit.counter =
                        5;

                    digit.owner =
                        null;

                    digit.noCorrectionNeeded =
                        false;

                }

            }

        }
    );


    /* ================================================
       訂正不要状態更新
    ================================================ */

    updateCorrectionStates();


    /* ================================================
       50点
    ================================================ */

    if (
        player.score >= 50
    ) {

        endGame(
            `${player.name()}が50点を先取しました。`,
            false
        );

        return;

    }


    /* ================================================
       10桁
    ================================================ */

    if (
        digits[9].filled
    ) {

        endGame(
            "小数10桁目に到達しました。",
            false
        );

        return;

    }


    /* ================================================
       カウント減少
    ================================================ */

    advanceCounters(
        highestChanged.digit
    );


    /* ================================================
       カウント0
    ================================================ */

    if (
        checkCounterZero()
    ) {

        return;

    }


    /* ================================================
       次のターン
    ================================================ */

    nextTurn();

    updateAll();


    if (
        isNewDigit
    ) {

        showMessage(
            `${player.name()}が`
            +
            `小数第${highestPosition}位を宣言しました。`
        );

    }

    else {

        showMessage(
            `${player.name()}が`
            +
            `小数第${highestPosition}位を訂正しました。`
        );

    }

}


/* =====================================================
   過去状態から数値
===================================================== */

function getNumberFromStates(states) {

    const stateMap =
        new Map();


    states.forEach(
        state => {

            stateMap.set(
                state.digit.position,
                state
            );

        }
    );


    let number =
        integerPart;


    for (
        let i = 0;
        i < digits.length;
        i++
    ) {

        const digit =
            digits[i];


        let value;


        if (
            stateMap.has(
                digit.position
            )
        ) {

            value =
                stateMap
                .get(
                    digit.position
                )
                .value;

        }

        else {

            value =
                digit.value;

        }


        if (
            value !== null
            &&
            value !== undefined
        ) {

            number +=
                value
                *
                Math.pow(
                    10,
                    -(i + 1)
                );

        }

        else {

            break;

        }

    }


    return cleanNumber(
        number,
        12
    );

}


/* =====================================================
   状態復元
===================================================== */

function restoreStates(states) {

    states.forEach(
        state => {

            state.digit.value =
                state.value;

            state.digit.filled =
                state.filled;

            state.digit.counter =
                state.counter;

            state.digit.owner =
                state.owner;

            state.digit
                .noCorrectionNeeded =
                state.noCorrectionNeeded;

        }
    );

}


/* =====================================================
   訂正時 全体カウント+2
===================================================== */

function boostAllCounters(
    correctedDigit
) {

    digits.forEach(
        digit => {

            if (
                !digit.filled
            ) {

                return;

            }


            if (
                digit.noCorrectionNeeded
            ) {

                return;

            }


            if (
                digit === correctedDigit
            ) {

                return;

            }


            digit.counter =
                Math.min(
                    5,
                    digit.counter + 2
                );

        }
    );


    correctedDigit.counter =
        5;

}


/* =====================================================
   訂正不要状態更新
===================================================== */

function updateCorrectionStates() {

    digits.forEach(
        digit => {

            checkNoCorrectionNeeded(
                digit
            );

        }
    );

}


/* =====================================================
   訂正不要判定
===================================================== */

function checkNoCorrectionNeeded(
    digit
) {

    if (
        !digit.filled
    ) {

        digit.noCorrectionNeeded =
            false;

        return;

    }


    /*
        9なら+1できない
    */

    if (
        digit.value === 9
    ) {

        digit.noCorrectionNeeded =
            true;

        return;

    }


    const number =
        getCurrentNumber();


    const amount =
        Math.pow(
            10,
            -digit.position
        );


    const increased =
        cleanNumber(
            number + amount,
            12
        );


    if (
        increased * increased
        >
        x
    ) {

        digit.noCorrectionNeeded =
            true;

    }

    else {

        digit.noCorrectionNeeded =
            false;

    }

}


/* =====================================================
   カウント減少
===================================================== */

function advanceCounters(
    resetDigit
) {

    digits.forEach(
        digit => {

            if (
                !digit.filled
            ) {

                return;

            }


            if (
                digit === resetDigit
            ) {

                return;

            }


            if (
                digit.noCorrectionNeeded
            ) {

                return;

            }


            if (
                digit.counter > 0
            ) {

                digit.counter--;

            }

        }
    );

}


/* =====================================================
   カウント0
===================================================== */

function checkCounterZero() {

    for (
        const digit of digits
    ) {

        if (
            digit.filled
            &&
            !digit.noCorrectionNeeded
            &&
            digit.counter <= 0
        ) {

            endGame(
                `小数第${digit.position}位の値が`
                +
                `5ターンの間修正されませんでした。`,
                true
            );


            return true;

        }

    }


    return false;

}


/* =====================================================
   次のプレイヤー
===================================================== */

function nextTurn() {

    let safety = 0;


    do {

        currentTurnIndex =
            (
                currentTurnIndex + 1
            )
            %
            turnOrder.length;


        safety++;

    }

    while (
        currentPlayer().eliminated
        &&
        safety < turnOrder.length
    );

}


/* =====================================================
   全員失格
===================================================== */

function checkElimination() {

    const alive =
        players.filter(
            player =>
                !player.eliminated
        );


    /*
        生存者が1人なら
        その人を勝者として終了
    */

    if (
        alive.length === 1
    ) {

        endGame(
            `${alive[0].name()}以外が全員失格になりました。`,
            true,
            alive[0]
        );


        return true;

    }


    /*
        全員失格
    */

    if (
        alive.length === 0
    ) {

        endGame(
            "全員が失格になりました。",
            true,
            null
        );


        return true;

    }


    return false;

}


/* =====================================================
   メッセージ
===================================================== */

function showMessage(text) {

    document
    .getElementById("message")
    .textContent =
        text;

}


/* =====================================================
   ゲーム終了
===================================================== */

function endGame(
    reason,
    gameOver = false,
    forcedWinner = null
) {

    gameStarted = false;


    const finalNumber =
        getCurrentNumber();


    /*
        失格者をランキングから
        勝者候補として除外
    */

    const alivePlayers =
        players.filter(
            player =>
                !player.eliminated
        );


    const ranking =
        [...players].sort(
            (a, b) => {

                /*
                    生存者を常に上位
                */

                if (
                    a.eliminated
                    &&
                    !b.eliminated
                ) {

                    return 1;

                }

                if (
                    !a.eliminated
                    &&
                    b.eliminated
                ) {

                    return -1;

                }


                return b.score - a.score;

            }
        );


    let winner =
        forcedWinner;


    if (
        !winner
        &&
        alivePlayers.length > 0
    ) {

        winner =
            [...alivePlayers].sort(
                (a, b) =>
                    b.score - a.score
            )[0];

    }


    /*
        タイトル
    */

    const endTitle =
        document
        .getElementById("endTitle");


    if (
        gameOver
    ) {

        endTitle.textContent =
            "GAME OVER";

    }

    else {

        endTitle.textContent =
            "GAME CLEAR";

    }


    let html = "";


    if (
        winner
    ) {

        html +=
            `<h2>🏆 勝者：${winner.name()}</h2>`;

    }

    else {

        html +=
            `<h2>勝者なし</h2>`;

    }


    html +=
        `<p>${reason}</p>`;


    /*
        最終値

        toFixed()を使用することで
        0.00000000002などの
        浮動小数点誤差を表示しない
    */

    html +=
        `
        <p>
        √${x} =
        ${sqrtX.toFixed(12)}
        <br>
        最終予測値 =
        ${finalNumber.toFixed(10)}
        </p>
        `;


    html +=
        `<h2>最終ポイント</h2>`;


    ranking.forEach(
        (player, index) => {

            html +=
                `
                <p>
                ${index + 1}位　
                ${player.name()}　
                ${player.score}pt
                ${
                    player.eliminated
                    ? "（失格）"
                    : ""
                }
                </p>
                `;

        }
    );


    document
    .getElementById("gameScreen")
    .classList
    .add("hidden");


    document
    .getElementById("endScreen")
    .classList
    .remove("hidden");


    document
    .getElementById("result")
    .innerHTML =
        html;

}

</script>
