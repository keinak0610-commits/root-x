}

   現在の数字
===================================================== */

}

}


/* =====================================================
   二乗表示
===================================================== */

#squareDisplay {

}

   警告
===================================================== */

#warning {
    margin-top: 15px;
    padding: 12px;

    background: #fff7d6;

    border: 2px solid #d6a900;

    border-radius: 8px;

/* =====================================================
   メッセージ
===================================================== */

#message {

/* =====================================================
   ボーナス

#bonusLog {

}

   ポイント表

#playerTable {

}

.player-card {

}

.player-number {

}


/* =====================================================
   結果
===================================================== */

#result {

}


/* =====================================================
   スマホ
===================================================== */

@media (max-width: 600px) {

    }

    }

    }

    }

    }

<script>

/* =====================================================
   プレイヤークラス
===================================================== */

class Player {

    constructor(number) {

        this.number = number;

        this.score = 0;

        this.eliminated = false;

    }


    name() {

        return "プレイヤー" + this.number;

    }

}


/* =====================================================
   桁クラス
===================================================== */

class Digit {

    constructor(position) {

        this.position = position;

        this.value = null;

        this.filled = false;

        this.counter = 5;

        this.owner = null;

        this.noCorrectionNeeded = false;

    }

}


/* =====================================================
   ゲーム変数
===================================================== */

let x;

let sqrtX;

let integerPart;

let players = [];

let turnOrder = [];

let currentTurnIndex = 0;

let digits = [];

let gameStarted = false;

let gameMode = "normal";

let timerInterval = null;

let gameStartTime = 0;


/* =====================================================
   モード取得
===================================================== */

function getSelectedMode() {

    const selected =
        document.querySelector(
            'input[name="gameMode"]:checked'
        );

    return selected
        ? selected.value
        : "normal";

}


/* =====================================================
   ゲーム開始
===================================================== */

function startGame() {

    const count =
        Number(
            document
            .getElementById("playerCount")
            .value
        );


    gameMode =
        getSelectedMode();


    /* -----------------------------------------------
       1～1000から平方数を除外
    ----------------------------------------------- */

    const candidates = [];


    for (
        let i = 1;
        i <= 1000;
        i++
    ) {

        if (
            !Number.isInteger(
                Math.sqrt(i)
            )
        ) {

            candidates.push(i);

        }

    }


    x =
        candidates[
            Math.floor(
                Math.random()
                *
                candidates.length
            )
        ];


    sqrtX =
        Math.sqrt(x);


    integerPart =
        Math.floor(sqrtX);


    /* -----------------------------------------------
       プレイヤー
    ----------------------------------------------- */

    players = [];


    for (
        let i = 1;
        i <= count;
        i++
    ) {

        players.push(
            new Player(i)
        );

    }


    /*
        プレイヤー番号順
    */

    turnOrder =
        [...players];


    currentTurnIndex = 0;


    /* -----------------------------------------------
       小数1～10桁
    ----------------------------------------------- */

    digits = [];


    for (
        let i = 1;
        i <= 10;
        i++
    ) {

        digits.push(
            new Digit(i)
        );

    }


    gameStarted = true;


    /* -----------------------------------------------
       画面切り替え
    ----------------------------------------------- */

    document
    .getElementById("startScreen")
    .classList
    .add("hidden");


    document
    .getElementById("gameScreen")
    .classList
    .remove("hidden");


    document
    .getElementById("sqrtQuestion")
    .textContent =
        `√${x} = ？`;


    /* -----------------------------------------------
       タイマー
    ----------------------------------------------- */

    if (
        gameMode === "infinite"
        ||
        gameMode === "timeTrial"
    ) {

        document
        .getElementById("timerDisplay")
        .classList
        .remove("hidden");


        startTimer();

    }

    else {

        document
        .getElementById("timerDisplay")
        .classList
        .add("hidden");

    }


    updateAll();


    showMessage(
        "小数第1位を予測してください。"
    );

}


/* =====================================================
   タイマー開始
===================================================== */

function startTimer() {

    stopTimer();


    gameStartTime =
        performance.now();


    updateTimer();


    timerInterval =
        setInterval(
            updateTimer,
            10
        );

}


/* =====================================================
   タイマー更新
===================================================== */

function updateTimer() {

    if (
        !gameStarted
    ) {

        return;

    }


    const elapsed =
        performance.now()
        -
        gameStartTime;


    const minutes =
        Math.floor(
            elapsed / 60000
        );


    const seconds =
        Math.floor(
            (elapsed % 60000)
            / 1000
        );


    const milliseconds =
        Math.floor(
            elapsed % 1000
        );


    document
    .getElementById("timerDisplay")
    .textContent =
        String(minutes).padStart(2, "0")
        +
        ":"
        +
        String(seconds).padStart(2, "0")
        +
        "."
        +
        String(milliseconds).padStart(3, "0");

}


/* =====================================================
   タイマー停止
===================================================== */

function stopTimer() {

    if (
        timerInterval !== null
    ) {

        clearInterval(
            timerInterval
        );

        timerInterval = null;

    }

}


/* =====================================================
   現在のプレイヤー
===================================================== */

function currentPlayer() {

    return turnOrder[currentTurnIndex];

}


/* =====================================================
   全体更新
===================================================== */

function updateAll() {

    updateTurn();

    updateNumber();

    updateSquare();

    updateWarning();

    updatePlayers();

}


/* =====================================================
   ターン表示
===================================================== */

function updateTurn() {

    let safety = 0;


    while (
        currentPlayer().eliminated
        &&
        safety < 20
    ) {

        currentTurnIndex =
            (
                currentTurnIndex + 1
            )
            %
            turnOrder.length;

        safety++;

    }


    document
    .getElementById("turnDisplay")
    .textContent =
        currentPlayer().name()
        +
        " のターン";

}


/* =====================================================
   数字入力欄
===================================================== */

function updateNumber() {

    const area =
        document
        .getElementById("currentNumber");


    area.innerHTML = "";


    const integer =
        document.createElement("span");


    integer.className =
        "decimal-label";


    integer.textContent =
        integerPart + ".";


    area.appendChild(integer);


    let lastFilled = 0;


    for (
        let i = 0;
        i < digits.length;
        i++
    ) {

        if (
            digits[i].filled
        ) {

            lastFilled =
                i + 1;

        }

        else {

            break;

        }

    }


    /*
        既存桁＋次の空白1マス
    */

    const displayCount =
        Math.min(
            lastFilled + 1,
            10
        );


    for (
        let i = 0;
        i < displayCount;
        i++
    ) {

        const digit =
            digits[i];


        const input =
            document.createElement("input");


        input.type =
            "text";


        input.inputMode =
            "numeric";


        input.maxLength =
            1;


        input.className =
            "digit-box";


        input.dataset.position =
            digit.position;


        if (
            digit.filled
        ) {

            input.value =
                digit.value;

        }


        input.addEventListener(
            "input",
            function() {

                this.value =
                    this.value
                    .replace(
                        /[^0-9]/g,
                        ""
                    )
                    .slice(
                        0,
                        1
                    );

            }
        );


        area.appendChild(input);

    }

}


/* =====================================================
   現在の数値
===================================================== */

function getCurrentNumber() {

    let number =
        integerPart;


    for (
        let i = 0;
        i < digits.length;
        i++
    ) {

        if (
            digits[i].filled
        ) {

            number +=
                digits[i].value
                *
                Math.pow(
                    10,
                    -(i + 1)
                );

        }

        else {

            break;

        }

    }


    return number;

}


/* =====================================================
   表示用数値
   浮動小数点誤差を見せない
===================================================== */

function formatNumber(value, maxDigits = 10) {

    return value.toFixed(maxDigits)
        .replace(/\.?0+$/, "");

}


/* =====================================================
   二乗表示
===================================================== */

function updateSquare() {

    const number =
        getCurrentNumber();


    const square =
        number * number;


    const area =
        document
        .getElementById("squareDisplay");


    area.innerHTML =
        `
        <div>
            現在の値：
            ${formatNumber(number, 10)}
        </div>

        <div>
            二乗：
            ${formatNumber(square, 10)}
        </div>
        `;

}


/* =====================================================
   カウント警告
===================================================== */

function updateWarning() {

    const area =
        document
        .getElementById("warning");


    const warningExists =
        digits.some(
            digit =>
                digit.filled
                &&
                !digit.noCorrectionNeeded
                &&
                digit.counter === 1
        );


    /*
        対象の桁番号は表示しない
    */

    if (
        warningExists
    ) {

        area.classList.remove(
            "hidden"
        );


        area.textContent =
            "次のターンまでに修正しなければいけない位があります。";

    }

    else {

        area.classList.add(
            "hidden"
        );

    }

}


/* =====================================================
   ポイント表
===================================================== */

function updatePlayers() {

    const area =
        document
        .getElementById("playerTable");


    area.innerHTML = "";


    players.forEach(
        player => {

            const card =
                document.createElement("div");


            card.className =
                "player-card";


            if (
                player.eliminated
            ) {

                card.classList.add(
                    "eliminated"
                );

            }


            card.innerHTML =
                `
                <div class="player-number">
                    ${player.name()}
                </div>

                <div class="player-score">
                    ${player.score} pt
                </div>
                `;


            area.appendChild(card);

        }
    );

}


/* =====================================================
   入力値取得
===================================================== */

function getInputValues() {

    const inputs =
        document.querySelectorAll(
            "#currentNumber .digit-box"
        );


    const result = [];


    inputs.forEach(
        input => {

            result.push({

                position:
                    Number(
                        input.dataset.position
                    ),

                value:
                    input.value === ""
                    ? null
                    : Number(
                        input.value
                    )

            });

        }
    );


    return result;

}


/* =====================================================
   ターン確定
===================================================== */

function confirmTurn() {

    if (
        !gameStarted
    ) {

        return;

    }


    const inputs =
        getInputValues();


    /* -----------------------------------------------
       最後の既存桁
    ----------------------------------------------- */

    let lastFilledPosition = 0;


    for (
        let i = 0;
        i < digits.length;
        i++
    ) {

        if (
            digits[i].filled
        ) {

            lastFilledPosition =
                i + 1;

        }

        else {

            break;

        }

    }


    /* -----------------------------------------------
       変更箇所
    ----------------------------------------------- */

    const changed = [];


    inputs.forEach(
        item => {

            const digit =
                digits[
                    item.position - 1
                ];


            const oldValue =
                digit.value;


            if (
                item.value !== oldValue
            ) {

                changed.push({

                    digit: digit,

                    newValue:
                        item.value,

                    oldValue:
                        oldValue

                });

            }

        }
    );


    if (
        changed.length === 0
    ) {

        showMessage(
            "数字を1つ以上変更してください。"
        );

        return;

    }


    changed.sort(
        (a, b) =>
            a.digit.position
            -
            b.digit.position
    );


    const highestChanged =
        changed[0];


    const highestPosition =
        highestChanged.digit.position;


    const isNewDigit =
        !highestChanged.digit.filled;


    /* ================================================
       新しい桁
    ================================================ */

    if (
        isNewDigit
    ) {

        if (
            highestPosition
            !==
            lastFilledPosition + 1
        ) {

            showMessage(
                "桁は1つずつ追加してください。"
            );

            updateAll();

            return;

        }


        for (
            const change of changed
        ) {

            if (
                change.digit.position
                >
                highestPosition
            ) {

                showMessage(
                    "新しい桁は1ターンにつき1つだけ追加できます。"
                );

                updateAll();

                return;

            }

        }

    }


    /* ================================================
       訂正
    ================================================ */

    else {

        for (
            const change of changed
        ) {

            const position =
                change.digit.position;


            /*
                訂正した桁より上位は変更不可
            */

            if (
                position
                <
                highestPosition
            ) {

                showMessage(
                    "訂正した桁より上位の桁は変更できません。"
                );

                updateAll();

                return;

            }


            /*
                下位は既存桁＋次の空白まで
            */

            if (
                position
                >
                lastFilledPosition + 1
            ) {

                showMessage(
                    "一度に追加できる新しい桁は1つだけです。"
                );

                updateAll();

                return;

            }

        }

    }


    /* ================================================
       空白にする
    ================================================ */

    for (
        const change of changed
    ) {

        if (
            change.newValue === null
        ) {

            /*
                空白にできるのは
                最後の既存桁だけ
            */

            if (
                change.digit.position
                !==
                lastFilledPosition
            ) {

                showMessage(
                    "空白にできるのは最後の桁だけです。"
                );

                updateAll();

                return;

            }

        }

    }


    /* ================================================
       状態保存
    ================================================ */

    const oldStates =
        changed.map(
            change => ({

                digit:
                    change.digit,

                value:
                    change.digit.value,

                filled:
                    change.digit.filled,

                counter:
                    change.digit.counter,

                owner:
                    change.digit.owner,

                noCorrectionNeeded:
                    change.digit
                    .noCorrectionNeeded

            })
        );


    /* ================================================
       一時変更
    ================================================ */

    changed.forEach(
        change => {

            change.digit.value =
                change.newValue;


            if (
                change.newValue === null
            ) {

                change.digit.filled =
                    false;

                change.digit.owner =
                    null;

            }

            else {

                change.digit.filled =
                    true;

            }

        }
    );


    /* ================================================
       数値比較
    ================================================ */

    const oldNumber =
        getNumberFromStates(
            oldStates
        );


    const newNumber =
        getCurrentNumber();


    /*
        訂正は
        「桁ごとの数字が大きい」
        ではなく、
        「完成した数値そのものが大きい」
        必要がある。
    */

    if (
        !isNewDigit
        &&
        newNumber <= oldNumber + 1e-12
    ) {

        restoreStates(
            oldStates
        );


        showMessage(
            "訂正後の値は、訂正前の値より大きくしてください。"
        );


        updateAll();

        return;

    }


    /* ================================================
       二乗判定
    ================================================ */

    const square =
        newNumber * newNumber;


    if (
        square > x + 1e-12
    ) {

        restoreStates(
            oldStates
        );


        const eliminatedPlayer =
            currentPlayer();


        eliminatedPlayer.eliminated =
            true;


        alert(
            `${eliminatedPlayer.name()}は失格です。\n\n`
            +
            `宣言値：${formatNumber(newNumber, 10)}\n`
            +
            `二乗：${formatNumber(square, 10)}\n`
            +
            `x：${x}`
        );


        if (
            checkElimination()
        ) {

            return;

        }


        nextTurn();

        updateAll();

        return;

    }


    /* ================================================
       成功
    ================================================ */

    const player =
        currentPlayer();


    /*
        ポイントは
        最上位の変更桁の値だけ
    */

    let point =
        highestChanged.newValue;


    if (
        point === null
    ) {

        point = 0;

    }


    player.score +=
        point;


    /*
        所有者
    */

    if (
        highestChanged.newValue
        !== null
    ) {

        highestChanged
            .digit
            .owner =
            player;

    }


    /* ================================================
       新規桁
    ================================================ */

    if (
        isNewDigit
    ) {

        highestChanged
            .digit
            .counter =
            5;

        highestChanged
            .digit
            .noCorrectionNeeded =
            false;

    }


    /* ================================================
       訂正
    ================================================ */

    if (
        !isNewDigit
    ) {

        const oldValue =
            highestChanged.oldValue;


        const newValue =
            highestChanged.newValue;


        /*
            訂正した桁は5に戻る
        */

        highestChanged
            .digit
            .counter =
            5;


        highestChanged
            .digit
            .noCorrectionNeeded =
            false;


        /*
            +5以上ならボーナス
        */

        if (
            newValue !== null
            &&
            oldValue !== null
            &&
            newValue - oldValue >= 5
        ) {

            player.score += 2;


            document
            .getElementById("bonusLog")
            .textContent =
                `（${player.name()}、大幅修正ボーナス +2点）`;

        }


        /*
            全体カウント+2
        */

        boostAllCounters(
            highestChanged.digit
        );

    }


    /* ================================================
       空白になった桁
    ================================================ */

    changed.forEach(
        change => {

            const digit =
                change.digit;


            if (
                digit
                !==
                highestChanged.digit
            ) {

                if (
                    change.newValue
                    === null
                ) {

                    digit.filled =
                        false;

                    digit.value =
                        null;

                    digit.counter =
                        5;

                    digit.owner =
                        null;

                    digit.noCorrectionNeeded =
                        false;

                }

            }

        }
    );


    /*
        訂正不要状態を再計算
    */

    updateCorrectionStates();


    /* ================================================
       モード別終了判定
    ================================================ */

    /*
        ① 50点先取
    */

    if (
        gameMode === "normal"
        &&
        player.score >= 50
    ) {

        endGame(
            "clear",
            `${player.name()}が50点を先取しました。`
        );

        return;

    }


    /*
        ①のみ
        10桁到達でもクリア
    */

    if (
        gameMode === "normal"
        &&
        digits[9].filled
    ) {

        endGame(
            "clear",
            "小数10桁目に到達しました。"
        );

        return;

    }


    /*
        ③ タイムトライアル
    */

    if (
        gameMode === "timeTrial"
        &&
        digits[9].filled
    ) {

        if (
            isExactTenDigits()
        ) {

            endGame(
                "clear",
                "小数10桁を正確に完成させました。"
            );

            return;

        }

    }


    /* ================================================
       カウント減少
    ================================================ */

    advanceCounters(
        highestChanged.digit
    );


    /* ================================================
       カウント0
    ================================================ */

    if (
        checkCounterZero()
    ) {

        return;

    }


    /* ================================================
       次のターン
    ================================================ */

    nextTurn();


    updateAll();


    if (
        isNewDigit
    ) {

        showMessage(
            `${player.name()}が`
            +
            `小数第${highestPosition}位を宣言しました。`
        );

    }

    else {

        showMessage(
            `${player.name()}が`
            +
            `小数第${highestPosition}位を訂正しました。`
        );

    }

}


/* =====================================================
   過去状態から数値
===================================================== */

function getNumberFromStates(states) {

    const stateMap =
        new Map();


    states.forEach(
        state => {

            stateMap.set(
                state.digit.position,
                state
            );

        }
    );


    let number =
        integerPart;


    for (
        let i = 0;
        i < digits.length;
        i++
    ) {

        const digit =
            digits[i];


        let value;


        if (
            stateMap.has(
                digit.position
            )
        ) {

            value =
                stateMap
                .get(
                    digit.position
                )
                .value;

        }

        else {

            value =
                digit.value;

        }


        if (
            value !== null
            &&
            value !== undefined
        ) {

            number +=
                value
                *
                Math.pow(
                    10,
                    -(i + 1)
                );

        }

        else {

            break;

        }

    }


    return number;

}


/* =====================================================
   状態復元
===================================================== */

function restoreStates(states) {

    states.forEach(
        state => {

            state.digit.value =
                state.value;

            state.digit.filled =
                state.filled;

            state.digit.counter =
                state.counter;

            state.digit.owner =
                state.owner;

            state.digit
                .noCorrectionNeeded =
                state.noCorrectionNeeded;

        }
    );

}


/* =====================================================
   全体カウント+2
===================================================== */

function boostAllCounters(
    correctedDigit
) {

    digits.forEach(
        digit => {

            if (
                !digit.filled
            ) {

                return;

            }


            if (
                digit.noCorrectionNeeded
            ) {

                return;

            }


            if (
                digit === correctedDigit
            ) {

                return;

            }


            digit.counter =
                Math.min(
                    5,
                    digit.counter + 2
                );

        }
    );


    correctedDigit.counter =
        5;

}


/* =====================================================
   訂正不要状態更新
===================================================== */

function updateCorrectionStates() {

    digits.forEach(
        digit => {

            checkNoCorrectionNeeded(
                digit
            );

        }
    );

}


/* =====================================================
   訂正不要判定
===================================================== */

function checkNoCorrectionNeeded(
    digit
) {

    if (
        !digit.filled
    ) {

        digit.noCorrectionNeeded =
            false;

        return;

    }


    /*
        9ならこれ以上増やせない
    */

    if (
        digit.value === 9
    ) {

        digit.noCorrectionNeeded =
            true;

        return;

    }


    const number =
        getCurrentNumber();


    const amount =
        Math.pow(
            10,
            -digit.position
        );


    /*
        その桁だけ+1した場合
    */

    const increased =
        number + amount;


    if (
        increased * increased
        >
        x + 1e-12
    ) {

        digit.noCorrectionNeeded =
            true;

    }

    else {

        digit.noCorrectionNeeded =
            false;

    }

}


/* =====================================================
   カウント減少
===================================================== */

function advanceCounters(
    resetDigit
) {

    digits.forEach(
        digit => {

            if (
                !digit.filled
            ) {

                return;

            }


            if (
                digit === resetDigit
            ) {

                return;

            }


            if (
                digit.noCorrectionNeeded
            ) {

                return;

            }


            if (
                digit.counter > 0
            ) {

                digit.counter--;

            }

        }
    );

}


/* =====================================================
   カウント0
===================================================== */

function checkCounterZero() {

    for (
        const digit of digits
    ) {

        if (
            digit.filled
            &&
            !digit.noCorrectionNeeded
            &&
            digit.counter <= 0
        ) {

            endGame(
                "over",
                `カウントが0になりました。`
                +
                `必要な訂正が行われなかったため、ゲームオーバーです。`
            );


            return true;

        }

    }


    return false;

}


/* =====================================================
   タイムトライアル
   正確な10桁か判定
===================================================== */

function isExactTenDigits() {

    /*
        Math.sqrt(x)から
        小数10桁を取得
    */

    const correct =
        Math.floor(
            sqrtX * 10000000000
        );


    /*
        ゲーム内の10桁
    */

    let predicted = 0;


    for (
        let i = 0;
        i < 10;
        i++
    ) {

        if (
            !digits[i].filled
        ) {

            return false;

        }


        predicted =
            predicted * 10
            +
            digits[i].value;

    }


    return predicted === correct;

}


/* =====================================================
   次のプレイヤー
===================================================== */

function nextTurn() {

    let safety = 0;


    do {

        currentTurnIndex =
            (
                currentTurnIndex + 1
            )
            %
            turnOrder.length;


        safety++;

    }

    while (
        currentPlayer().eliminated
        &&
        safety < 20
    );

}


/* =====================================================
   失格判定
===================================================== */

function checkElimination() {

    const alive =
        players.filter(
            player =>
                !player.eliminated
        );


    /*
        一人だけ残った場合は
        ゲームオーバー
    */

    if (
        alive.length === 1
        &&
        players.length > 1
    ) {

        endGame(
            "over",
            `${alive[0].name()}以外が全員失格になりました。`
        );

        return true;

    }


    /*
        全員失格
    */

    if (
        alive.length === 0
    ) {

        endGame(
            "over",
            "全員が失格になりました。"
        );

        return true;

    }


    return false;

}


/* =====================================================
   メッセージ
===================================================== */

function showMessage(text) {

    document
    .getElementById("message")
    .textContent =
        text;

}


/* =====================================================
   ゲーム終了
===================================================== */

function endGame(
    resultType,
    reason
) {

    if (
        !gameStarted
    ) {

        return;

    }


    gameStarted = false;


    stopTimer();


    const finalNumber =
        getCurrentNumber();


    /*
        失格者を除外して順位作成
    */

    const ranking =
        [...players]
        .filter(
            player =>
                !player.eliminated
        )
        .sort(
            (a, b) =>
                b.score - a.score
        );


    /*
        全員失格なら
        失格者も表示する
    */

    const allRanking =
        [...players].sort(
            (a, b) =>
                b.score - a.score
        );


    let winnerText =
        "勝者なし";


    if (
        ranking.length > 0
    ) {

        winnerText =
            `🏆 勝者：${ranking[0].name()}`;

    }


    /*
        タイトル
    */

    document
    .getElementById("endTitle")
    .textContent =
        resultType === "clear"
        ? "GAME CLEAR"
        : "GAME OVER";


    let html =
        `<h2>${winnerText}</h2>`;


    html +=
        `<p>${reason}</p>`;


    /*
        タイムトライアルなら
        最終タイムを表示
    */

    if (
        gameMode === "timeTrial"
    ) {

        html +=
            `
            <p>
                クリアタイム：
                <strong>
                    ${getTimerText()}
                </strong>
            </p>
            `;

    }


    html +=
        `
        <p>
            √${x} =
            ${sqrtX.toFixed(12)}
            <br>
            最終予測値 =
            ${formatNumber(finalNumber, 10)}
        </p>
        `;


    html +=
        `<h2>最終ポイント</h2>`;


    allRanking.forEach(
        (player, index) => {

            html +=
                `
                <p>
                    ${index + 1}位　
                    ${player.name()}　
                    ${player.score}pt
                    ${
                        player.eliminated
                        ? "（失格）"
                        : ""
                    }
                </p>
                `;

        }
    );


    document
    .getElementById("gameScreen")
    .classList
    .add("hidden");


    document
    .getElementById("endScreen")
    .classList
    .remove("hidden");


    document
    .getElementById("result")
    .innerHTML =
        html;

}


/* =====================================================
   タイマー文字列取得
===================================================== */

function getTimerText() {

    const elapsed =
        performance.now()
        -
        gameStartTime;


    const minutes =
        Math.floor(
            elapsed / 60000
        );


    const seconds =
        Math.floor(
            (elapsed % 60000)
            / 1000
        );


    const milliseconds =
        Math.floor(
            elapsed % 1000
        );


    return (
        String(minutes).padStart(2, "0")
        +
        ":"
        +
        String(seconds).padStart(2, "0")
        +
        "."
        +
        String(milliseconds).padStart(3, "0")
    );

}
