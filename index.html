<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>√x</title>

<style>

/* =====================================================
   全体
===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 10px;

    background: #f2f2f2;
    color: #222;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;
}

.container {
    max-width: 900px;
    margin: auto;

    padding: 15px;

    background: white;

    border-radius: 15px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,0.15);
}


/* =====================================================
   共通
===================================================== */

h1 {
    text-align: center;
    margin: 5px 0 15px;
}

.center {
    text-align: center;
}

.hidden {
    display: none !important;
}


/* =====================================================
   ボタン
===================================================== */

button {
    padding: 11px 18px;
    margin: 5px;

    font-size: 17px;

    background: white;

    border: 1px solid #888;

    border-radius: 8px;
}

button:active {
    transform: scale(0.97);
}


/* =====================================================
   セレクト
===================================================== */

select {
    padding: 8px;
    font-size: 18px;
}


/* =====================================================
   スタート画面
===================================================== */

.mode-description {
    margin: 20px auto;
    max-width: 650px;

    text-align: left;

    background: #f7f7f7;

    padding: 15px;

    border-radius: 10px;
}

.mode-description h3 {
    margin-bottom: 5px;
}

.mode-description p {
    margin-top: 5px;
    line-height: 1.6;
}


/* =====================================================
   ゲーム画面
===================================================== */

#gameArea {
    padding: 15px;

    text-align: center;

    background: #fafafa;

    border: 2px solid #444;

    border-radius: 12px;
}

#sqrtQuestion {
    font-size: 28px;
    font-weight: bold;
}

#turnDisplay {
    margin-top: 18px;

    font-size: 21px;
    font-weight: bold;
}


/* =====================================================
   タイマー
===================================================== */

#timerDisplay {
    margin-top: 10px;

    font-size: 25px;
    font-weight: bold;

    font-family: monospace;
}


/* =====================================================
   オーバー表示
===================================================== */

#overMessage {
    margin-top: 10px;

    font-size: 28px;

    font-weight: bold;

    color: red;
}


/* =====================================================
   現在の数字
===================================================== */

#currentNumber {
    display: flex;

    align-items: center;
    justify-content: center;

    margin: 20px 0;

    padding: 8px 5px;

    overflow-x: auto;

    white-space: nowrap;

    -webkit-overflow-scrolling: touch;
}

.decimal-label {
    flex-shrink: 0;

    font-family: monospace;

    font-size: 34px;

    font-weight: bold;
}


/* =====================================================
   数字入力
===================================================== */

.digit-box {
    flex-shrink: 0;

    width: 48px;
    min-width: 48px;

    height: 54px;

    margin: 3px;

    padding: 0;

    text-align: center;

    font-family: monospace;

    font-size: 30px;

    line-height: 50px;

    border: 2px solid #777;

    border-radius: 6px;

    background: white;
}

.digit-box:focus {
    outline: none;

    border: 3px solid #333;
}


/* =====================================================
   二乗表示
===================================================== */

#squareDisplay {
    margin-top: 15px;

    padding: 15px;

    background: #eaeaea;

    border-radius: 8px;

    font-size: 26px;

    font-weight: bold;

    line-height: 1.7;
}

.safe {
    color: green;
}

.over {
    color: red;
}


/* =====================================================
   カウント警告
===================================================== */

#warning {
    margin-top: 15px;

    padding: 12px;

    background: #fff7d6;

    border: 2px solid #d6a900;

    border-radius: 8px;

    color: #765900;

    font-weight: bold;

    white-space: pre-line;
}


/* =====================================================
   メッセージ
===================================================== */

#message {
    margin-top: 15px;

    padding: 10px;

    background: #eee;

    border-radius: 8px;
}


/* =====================================================
   ボーナス
===================================================== */

#bonusLog {
    min-height: 25px;

    margin-top: 15px;

    font-weight: bold;
}


/* =====================================================
   ポイント表
===================================================== */

#playerTable {
    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 10px;

    margin-top: 15px;
}

.player-card {
    width: 115px;

    min-height: 75px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    background: white;

    border: 2px solid #555;

    border-radius: 10px;
}

.player-number {
    font-size: 17px;

    font-weight: bold;
}

.player-score {
    margin-top: 5px;

    font-size: 24px;
}

.player-card.eliminated {
    opacity: 0.4;

    text-decoration: line-through;
}


/* =====================================================
   結果
===================================================== */

#result {
    font-size: 18px;

    line-height: 1.7;
}


/* =====================================================
   スマホ
===================================================== */

@media (max-width: 600px) {

    body {
        padding: 5px;
    }

    .container {
        padding: 10px;
    }

    #sqrtQuestion {
        font-size: 25px;
    }

    #turnDisplay {
        font-size: 19px;
    }

    .decimal-label {
        font-size: 30px;
    }

    .digit-box {
        width: 44px;
        min-width: 44px;

        height: 50px;

        font-size: 28px;

        line-height: 46px;

        margin: 2px;
    }

    #squareDisplay {
        font-size: 23px;
    }

}

</style>

<body>

<div class="container">


<!-- =================================================
     スタート画面
================================================= -->

<div id="startScreen">

    <h1>√x</h1>


    <!-- 説明文のみ変更 -->

    <div class="mode-description">

        <h3>① 50点先取モード</h3>

        <p>
            50点を先に取った人の勝ちとなります。
            （複数人でのプレイ推奨）
        </p>


        <h3>② 無限小数モード</h3>

        <p>

            小数第七位までの値を
            「早く、正確に」予想してください。
        </p>

    </div>


    <div class="center">


        <!-- ゲームモード -->

        <label>
            ゲームモード：
        </label>

        <select id="gameMode"
                onchange="updateModeUI()">

            <option value="normal">
                50点先取モード
            </option>

            <option value="infinite">
                無限小数モード
            </option>

            </option>

        </select>


        <br><br>


        <!-- 無限小数スコア -->

        <div id="infiniteScoreArea">

            <label>
                無限小数モードのスコア：
            </label>

            <select id="infiniteScore">

                <option value="off">
                    なし
                </option>

                <option value="on">
                    あり
                </option>

            </select>

            <br><br>

        </div>


        <!-- プレイヤー人数 -->

        <label>
            プレイヤー人数：
        </label>

        <select id="playerCount">

            <option value="1" selected>
                1人
            </option>

            <option value="2">
                2人
            </option>

            <option value="3">
                3人
            </option>

            <option value="4">
                4人
            </option>

            <option value="5">
                5人
            </option>

            <option value="6">
                6人
            </option>

            <option value="7">
                7人
            </option>

            <option value="8">
                8人
            </option>

        </select>


        <br><br>


        <button onclick="startGame()">
            ゲーム開始
        </button>

    </div>

</div>


<!-- =================================================
     ゲーム画面
================================================= -->

<div id="gameScreen"
     class="hidden">


    <div id="gameArea">


        <h1>√x</h1>


        <div id="sqrtQuestion"></div>


        <div id="turnDisplay"></div>


        <div id="timerDisplay"
             class="hidden">
            00:00.00
        </div>


        <div id="overMessage"
             class="hidden">
            オーバー！
        </div>


        <div id="currentNumber"></div>


        <div id="squareDisplay"></div>


        <div id="warning"
             class="hidden">
        </div>


        <button onclick="confirmTurn()">
            この桁を確定
        </button>


        <div id="message"></div>


        <div id="bonusLog"></div>

    </div>


    <h2 class="center"
        id="scoreTitle">
        ポイント
    </h2>


    <div id="playerTable"></div>

</div>


<!-- =================================================
     終了画面
================================================= -->

<div id="endScreen"
     class="hidden">


    <h1 id="endTitle">
        GAME OVER
    </h1>


    <div id="result"></div>


    <div class="center">

        <button onclick="location.reload()">
            もう一度遊ぶ
        </button>

    </div>

</div>


</div>


<script>


/* =====================================================
   プレイヤー
===================================================== */

class Player {

    constructor(number) {

        this.number = number;

        this.score = 0;

        this.eliminated = false;

    }


    name() {

        return "プレイヤー" + this.number;

    }

}


/* =====================================================
   桁
===================================================== */

class Digit {

    constructor(position) {

        this.position = position;

        this.value = null;

        this.filled = false;

        this.counter = 5;

        this.owner = null;

        this.noCorrectionNeeded = false;

    }

}


/* =====================================================
   ゲーム変数
===================================================== */

let x;

let sqrtX;

let integerPart;

let players = [];

let turnOrder = [];

let currentTurnIndex = 0;

let digits = [];

let gameStarted = false;

let gameMode = "normal";

let scoreEnabled = true;

let startTime = 0;

let timerInterval = null;

let elapsedSeconds = 0;

let timePenalty = 0;


/* =====================================================
   モードUI
===================================================== */

function updateModeUI() {

    const mode =
        document
        .getElementById("gameMode")
        .value;


    const infiniteArea =
        document
        .getElementById("infiniteScoreArea");


    if (
        mode === "infinite"
    ) {

        infiniteArea
            .classList
            .remove("hidden");

    }

    else {

        infiniteArea
            .classList
            .add("hidden");

    }

}


/* =====================================================
   初期状態
===================================================== */

updateModeUI();


/* =====================================================
   ゲーム開始
===================================================== */

function startGame() {

    gameMode =
        document
        .getElementById("gameMode")
        .value;


    const count =
        Number(
            document
            .getElementById("playerCount")
            .value
        );


    if (
        gameMode === "infinite"
    ) {

        scoreEnabled =
            document
            .getElementById("infiniteScore")
            .value
            ===
            "on";

    }

    else if (
        gameMode === "normal"
    ) {

        scoreEnabled = true;

    }

    else {

        scoreEnabled = false;

    }


    /* ---------------------------------------------
       x
    --------------------------------------------- */

    const candidates = [];


    for (
        let i = 1;
        i <= 1000;
        i++
    ) {

        if (
            !Number.isInteger(
                Math.sqrt(i)
            )
        ) {

            candidates.push(i);

        }

    }


    x =
        candidates[
            Math.floor(
                Math.random()
                *
                candidates.length
            )
        ];


    sqrtX =
        Math.sqrt(x);


    integerPart =
        Math.floor(sqrtX);


    /* ---------------------------------------------
       プレイヤー
    --------------------------------------------- */

    players = [];


    for (
        let i = 1;
        i <= count;
        i++
    ) {

        players.push(
            new Player(i)
        );

    }


    turnOrder =
        [...players];


    currentTurnIndex = 0;


    /* ---------------------------------------------
       桁
    --------------------------------------------- */

    digits = [];


    /*
       通常・無限は最大100桁まで内部保持。
       タイムトライアルは7桁。
    */

    const digitLimit =
        gameMode === "time"
        ? 7
        : 100;


    for (
        let i = 1;
        i <= digitLimit;
        i++
    ) {

        digits.push(
            new Digit(i)
        );

    }


    gameStarted = true;


    /* ---------------------------------------------
       画面
    --------------------------------------------- */

    document
    .getElementById("startScreen")
    .classList
    .add("hidden");


    document
    .getElementById("gameScreen")
    .classList
    .remove("hidden");


    document
    .getElementById("endScreen")
    .classList
    .add("hidden");


    document
    .getElementById("sqrtQuestion")
    .textContent =
        `√${x} = ？`;


    /* ---------------------------------------------
       モード別UI
    --------------------------------------------- */

    const timer =
        document
        .getElementById("timerDisplay");


    const scoreTitle =
        document
        .getElementById("scoreTitle");


    if (
        gameMode === "normal"
        ||
        gameMode === "infinite"
            &&
        scoreEnabled
    ) {

        scoreTitle
            .classList
            .remove("hidden");

    }

    else {

        scoreTitle
            .classList
            .add("hidden");

    }


    if (
        gameMode === "infinite"
        ||
        gameMode === "time"
    ) {

        timer
            .classList
            .remove("hidden");

    }

    else {

        timer
            .classList
            .add("hidden");

    }


    document
    .getElementById("overMessage")
    .classList
    .add("hidden");


    timePenalty = 0;


    startTimer();


    updateAll();


    showMessage(
        "小数第1位を予測してください。"
    );

}


/* =====================================================
   タイマー
===================================================== */

function startTimer() {

    stopTimer();


    if (
        gameMode !== "infinite"
        &&
        gameMode !== "time"
    ) {

        return;

    }


    startTime =
        performance.now();


    timerInterval =
        setInterval(
            updateTimer,
            50
        );

}


function stopTimer() {

    if (
        timerInterval !== null
    ) {

        clearInterval(
            timerInterval
        );

        timerInterval = null;

    }

}


function updateTimer() {

    if (
        !gameStarted
    ) {

        return;

    }


    const now =
        performance.now();


    elapsedSeconds =
        (
            now - startTime
        )
        /
        1000;


    const displayTime =
        elapsedSeconds
        +
        timePenalty;


    const minutes =
        Math.floor(
            displayTime / 60
        );


    const seconds =
        displayTime % 60;


    document
    .getElementById("timerDisplay")
    .textContent =
        String(minutes)
        .padStart(2, "0")
        +
        ":"
        +
        seconds
        .toFixed(2)
        .padStart(5, "0");

}


/* =====================================================
   現在のプレイヤー
===================================================== */

function currentPlayer() {

    return turnOrder[currentTurnIndex];

}


/* =====================================================
   全体更新
===================================================== */

function updateAll() {

    updateTurn();

    updateNumber();

    updateSquare();

    updateWarning();

    updatePlayers();

}


/* =====================================================
   ターン
===================================================== */

function updateTurn() {

    if (
        !currentPlayer()
    ) {

        return;

    }


    let safety = 0;


    while (
        currentPlayer().eliminated
        &&
        safety < turnOrder.length
    ) {

        currentTurnIndex =
            (
                currentTurnIndex + 1
            )
            %
            turnOrder.length;

        safety++;

    }


    document
    .getElementById("turnDisplay")
    .textContent =
        currentPlayer().name()
        +
        " のターン";

}


/* =====================================================
   数字入力欄
===================================================== */

function updateNumber() {

    const area =
        document
        .getElementById("currentNumber");


    area.innerHTML = "";


    const integer =
        document.createElement("span");


    integer.className =
        "decimal-label";


    integer.textContent =
        integerPart + ".";


    area.appendChild(integer);


    let lastFilled = 0;


    for (
        let i = 0;
        i < digits.length;
        i++
    ) {

        if (
            digits[i].filled
        ) {

            lastFilled =
                i + 1;

        }

        else {

            break;

        }

    }


    const displayCount =
        Math.min(
            lastFilled + 1,
            digits.length
        );


    for (
        let i = 0;
        i < displayCount;
        i++
    ) {

        const digit =
            digits[i];


        const input =
            document.createElement("input");


        input.type =
            "text";


        input.inputMode =
            "numeric";


        input.maxLength =
            1;


        input.className =
            "digit-box";


        input.dataset.position =
            digit.position;


        if (
            digit.filled
        ) {

            input.value =
                digit.value;

        }


        input.addEventListener(
            "input",
            function() {

                this.value =
                    this.value
                    .replace(
                        /[^0-9]/g,
                        ""
                    )
                    .slice(
                        0,
                        1
                    );

            }
        );


        area.appendChild(input);

    }

}


/* =====================================================
   現在の数値
===================================================== */

function getCurrentNumber() {

    let number =
        integerPart;


    for (
        let i = 0;
        i < digits.length;
        i++
    ) {

        if (
            digits[i].filled
        ) {

            number +=
                digits[i].value
                *
                Math.pow(
                    10,
                    -(i + 1)
                );

        }

        else {

            break;

        }

    }


    return number;

}


/* =====================================================
   表示用の数値
===================================================== */

function getDisplayNumber() {

    let result =
        String(integerPart);


    let last =
        -1;


    for (
        let i = 0;
        i < digits.length;
        i++
    ) {

        if (
            digits[i].filled
        ) {

            last = i;

        }
        else {

            break;

        }

    }


    if (
        last < 0
    ) {

        return result;

    }


    result += ".";


    for (
        let i = 0;
        i <= last;
        i++
    ) {

        result +=
            String(
                digits[i].value
            );

    }


    return result;

}


/* =====================================================
   二乗表示
===================================================== */

function updateSquare() {

    const number =
        getCurrentNumber();


    const square =
        number * number;


    const area =
        document
        .getElementById("squareDisplay");


    area.className = "";


    if (
        square > x
    ) {

        area.classList.add("over");

    }

    else {

        area.classList.add("safe");

    }


    area.innerHTML =
        `
        <div>
            現在の値：
            ${getDisplayNumber()}
        </div>

        <div>
            二乗：
            ${formatNumber(square)}
        </div>
        `;

}


/* =====================================================
   小数の不要な0を除去
===================================================== */

function formatNumber(number) {

    /*
       十分な精度で計算したあと、
       不要な0だけ取り除く。
    */

    let text =
        number.toFixed(12);


    text =
        text.replace(
            /0+$/,
            ""
        );


    text =
        text.replace(
            /\.$/,
            ""
        );


    return text;

}


/* =====================================================
   カウント警告
===================================================== */

function updateWarning() {

    const area =
        document
        .getElementById("warning");


    const warnings = [];


    digits.forEach(
        digit => {

            if (
                digit.filled
                &&
                !digit.noCorrectionNeeded
                &&
                digit.counter === 1
            ) {

                warnings.push(
                    digit.position
                );

            }

        }
    );


    if (
        warnings.length > 0
    ) {

        area.classList.remove(
            "hidden"
        );


        area.textContent =
            "次のターンまでに修正しなければいけない位があります。";

    }

    else {

        area.classList.add(
            "hidden"
        );

    }

}


/* =====================================================
   プレイヤー表
===================================================== */

function updatePlayers() {

    const area =
        document
        .getElementById("playerTable");


    area.innerHTML = "";


    if (
        !scoreEnabled
    ) {

        return;

    }


    players.forEach(
        player => {

            const card =
                document.createElement("div");


            card.className =
                "player-card";


            if (
                player.eliminated
            ) {

                card.classList.add(
                    "eliminated"
                );

            }


            card.innerHTML =
                `
                <div class="player-number">
                    ${player.name()}
                </div>

                <div class="player-score">
                    ${player.score} pt
                </div>
                `;


            area.appendChild(card);

        }
    );

}


/* =====================================================
   入力値
===================================================== */

function getInputValues() {

    const inputs =
        document.querySelectorAll(
            "#currentNumber .digit-box"
        );


    const result = [];


    inputs.forEach(
        input => {

            result.push({

                position:
                    Number(
                        input.dataset.position
                    ),

                value:
                    input.value === ""
                    ? null
                    : Number(
                        input.value
                    )

            });

        }
    );


    return result;

}


/* =====================================================
   ターン確定
===================================================== */

function confirmTurn() {

    if (
        !gameStarted
    ) {

        return;

    }


    const inputs =
        getInputValues();


    let lastFilledPosition = 0;


    for (
        let i = 0;
        i < digits.length;
        i++
    ) {

        if (
            digits[i].filled
        ) {

            lastFilledPosition =
                i + 1;

        }

        else {

            break;

        }

    }


    const changed = [];


    inputs.forEach(
        item => {

            const digit =
                digits[
                    item.position - 1
                ];


            if (
                !digit
            ) {

                return;

            }


            const oldValue =
                digit.value;


            if (
                item.value !== oldValue
            ) {

                changed.push({

                    digit: digit,

                    newValue:
                        item.value,

                    oldValue:
                        oldValue

                });

            }

        }
    );


    if (
        changed.length === 0
    ) {

        showMessage(
            "数字を1つ以上変更してください。"
        );

        return;

    }


    changed.sort(
        (a, b) =>
            a.digit.position
            -
            b.digit.position
    );


    const highestChanged =
        changed[0];


    const highestPosition =
        highestChanged
        .digit
        .position;


    const isNewDigit =
        !highestChanged
        .digit
        .filled;


    /* =================================================
       新規桁
    ================================================= */

    if (
        isNewDigit
    ) {

        if (
            highestPosition
            !==
            lastFilledPosition + 1
        ) {

            showMessage(
                "桁は1つずつ追加してください。"
            );

            updateAll();

            return;

        }


        /*
           新規追加時は
           空白1マスだけ変更可能。
        */

        if (
            changed.length > 1
        ) {

            showMessage(
                "新しい桁を追加する場合、変更できるのはその1桁だけです。"
            );

            updateAll();

            return;

        }

    }


    /* =================================================
       訂正
    ================================================= */

    else {

        for (
            const change of changed
        ) {

            const position =
                change.digit.position;


            /*
               訂正した桁より上位は不可
            */

            if (
                position <
                highestPosition
            ) {

                showMessage(
                    "訂正した桁より上位の桁は変更できません。"
                );

                updateAll();

                return;

            }


            /*
               既存桁から最後まで。
               最後の空白マスも変更可能。
            */

            if (
                position >
                lastFilledPosition + 1
            ) {

                showMessage(
                    "一度に追加できる新しい桁は1つだけです。"
                );

                updateAll();

                return;

            }

        }

    }


    /* =================================================
       空白化
    ================================================= */

    for (
        const change of changed
    ) {

        if (
            change.newValue === null
        ) {

            /*
               空白にできるのは
               現在の最後の桁だけ。
            */

            if (
                change.digit.position
                !==
                lastFilledPosition
            ) {

                showMessage(
                    "空白にできるのは最後の桁だけです。"
                );

                updateAll();

                return;

            }

        }

    }


    /* =================================================
       状態保存
    ================================================= */

    const oldStates =
        changed.map(
            change => ({

                digit:
                    change.digit,

                value:
                    change.digit.value,

                filled:
                    change.digit.filled,

                counter:
                    change.digit.counter,

                owner:
                    change.digit.owner,

                noCorrectionNeeded:
                    change.digit
                    .noCorrectionNeeded

            })
        );


    /* =================================================
       一時変更
    ================================================= */

    changed.forEach(
        change => {

            change.digit.value =
                change.newValue;


            if (
                change.newValue === null
            ) {

                change.digit.filled =
                    false;

                change.digit.owner =
                    null;

                change.digit.counter =
                    5;

                change.digit.noCorrectionNeeded =
                    false;

            }

            else {

                change.digit.filled =
                    true;

            }

        }
    );


    const oldNumber =
        getNumberFromStates(
            oldStates
        );


    const newNumber =
        getCurrentNumber();


    /* =================================================
       訂正後の値
    =================================================

       重要：
       「桁そのものを大きくしたか」ではなく、
       全体の数値が大きくなったかで判定。
       
       したがって
       18 → 20
       190 → 201
       のような変更が可能。
    */

    if (
        !isNewDigit
        &&
        newNumber <= oldNumber
    ) {

        restoreStates(
            oldStates
        );


        showMessage(
            "訂正後の値は、訂正前の値より大きくしてください。"
        );


        updateAll();

        return;

    }


    /* =================================================
       √xを超えた場合
    ================================================= */

    const square =
        newNumber * newNumber;


    if (
        square > x
    ) {

        restoreStates(
            oldStates
        );


        /*
           タイムトライアルだけは
           オーバーしても終了しない。
        */

        if (
            gameMode === "time"
        ) {

            timePenalty += 15;


            const over =
                document
                .getElementById("overMessage");


            over.classList.remove(
                "hidden"
            );


            setTimeout(
                () => {

                    over.classList.add(
                        "hidden"
                    );

                },
                1200
            );


            showMessage(
                "オーバー！15秒加算されました。"
            );


            updateAll();

            return;

        }


        /*
           通常・無限では失格
        */

        currentPlayer()
            .eliminated =
            true;


        alert(
            `${currentPlayer().name()}は失格です。\n\n`
            +
            `宣言値：${formatNumber(newNumber)}\n`
            +
            `二乗：${formatNumber(square)}\n`
            +
            `x：${x}`
        );


        if (
            checkElimination()
        ) {

            return;

        }


        nextTurn();

        updateAll();

        return;

    }


    /* =================================================
       成功
    ================================================= */

    const player =
        currentPlayer();


    /* =================================================
       ポイント
    ================================================= */

    if (
        scoreEnabled
    ) {

        let point =
            highestChanged.newValue;


        if (
            point === null
        ) {

            point = 0;

        }


        player.score +=
            point;

    }


    /* =================================================
       所有者
    ================================================= */

    if (
        highestChanged.newValue
        !== null
    ) {

        highestChanged
            .digit
            .owner =
            player;

    }


    /* =================================================
       新規桁
    ================================================= */

    if (
        isNewDigit
    ) {

        highestChanged
            .digit
            .counter =
            5;

        highestChanged
            .digit
            .noCorrectionNeeded =
            false;

    }


    /* =================================================
       訂正
    ================================================= */

    if (
        !isNewDigit
    ) {

        const oldValue =
            highestChanged.oldValue;


        const newValue =
            highestChanged.newValue;


        /*
           訂正した桁は5に戻す
        */

        highestChanged
            .digit
            .counter =
            5;


        highestChanged
            .digit
            .noCorrectionNeeded =
            false;


        /*
           大幅修正ボーナス
        */

        if (
            scoreEnabled
            &&
            newValue !== null
            &&
            oldValue !== null
            &&
            newValue - oldValue >= 5
        ) {

            player.score += 2;


            document
            .getElementById("bonusLog")
            .textContent =
                `（${player.name()}、大幅修正ボーナス＋2）`;

        }


        /*
           全体カウント＋2
        */

        boostAllCounters(
            highestChanged.digit
        );

    }


    /* =================================================
       空白になった桁
    ================================================= */

    changed.forEach(
        change => {

            const digit =
                change.digit;


            if (
                digit !==
                highestChanged.digit
            ) {

                if (
                    change.newValue === null
                ) {

                    digit.filled =
                        false;

                    digit.value =
                        null;

                    digit.counter =
                        5;

                    digit.owner =
                        null;

                    digit.noCorrectionNeeded =
                        false;

                }

            }

        }
    );


    /*
       空白化によって後続桁が存在できなくなるので、
       その下位桁もクリアする。
    */

    for (
        let i = 0;
        i < digits.length - 1;
        i++
    ) {

        if (
            !digits[i].filled
        ) {

            for (
                let j = i + 1;
                j < digits.length;
                j++
            ) {

                digits[j].filled =
                    false;

                digits[j].value =
                    null;

                digits[j].counter =
                    5;

                digits[j].owner =
                    null;

                digits[j].noCorrectionNeeded =
                    false;

            }

            break;

        }

    }


    /* =================================================
       訂正不要状態
    ================================================= */

    updateCorrectionStates();


    /* =================================================
       タイムトライアル
    ================================================= */

    if (
        gameMode === "time"
    ) {

        /*
           7桁まで正確に埋まったら
           クリア。
        */

        if (
            digits.length >= 7
            &&
            digits[6].filled
        ) {

            endGame(
                "小数第7位まで正確に予測しました。",
                true
            );

            return;

        }

    }


    /* =================================================
       50点
    ================================================= */

    if (
        gameMode === "normal"
        &&
        player.score >= 50
    ) {

        endGame(
            `${player.name()}が50点を先取しました。`,
            true
        );

        return;

    }


    /* =================================================
       無限小数
    =================================================

       10桁終了なし。
    */


    /* =================================================
       通常モード10桁終了
    ================================================= */

    if (
        gameMode === "normal"
        &&
        digits.length >= 10
        &&
        digits[9].filled
    ) {

        endGame(
            "小数第10位まで到達しました。",
            true
        );

        return;

    }


    /* =================================================
       カウント減少
    ================================================= */

    advanceCounters(
        highestChanged.digit
    );


    /* =================================================
       カウント0
    ================================================= */

    if (
        checkCounterZero()
    ) {

        return;

    }


    /* =================================================
       次のターン
    ================================================= */

    nextTurn();


    updateAll();


    if (
        isNewDigit
    ) {

        showMessage(
            `${player.name()}が`
            +
            `小数第${highestPosition}位を宣言しました。`
        );

    }

    else {

        showMessage(
            `${player.name()}が`
            +
            `小数第${highestPosition}位を訂正しました。`
        );

    }

}


/* =====================================================
   過去状態から数値
===================================================== */

function getNumberFromStates(states) {

    const stateMap =
        new Map();


    states.forEach(
        state => {

            stateMap.set(
                state.digit.position,
                state
            );

        }
    );


    let number =
        integerPart;


    for (
        let i = 0;
        i < digits.length;
        i++
    ) {

        const digit =
            digits[i];


        let value;


        if (
            stateMap.has(
                digit.position
            )
        ) {

            value =
                stateMap
                .get(
                    digit.position
                )
                .value;

        }

        else {

            value =
                digit.value;

        }


        if (
            value !== null
            &&
            value !== undefined
        ) {

            number +=
                value
                *
                Math.pow(
                    10,
                    -(i + 1)
                );

        }

        else {

            break;

        }

    }


    return number;

}


/* =====================================================
   状態復元
===================================================== */

function restoreStates(states) {

    states.forEach(
        state => {

            state.digit.value =
                state.value;

            state.digit.filled =
                state.filled;

            state.digit.counter =
                state.counter;

            state.digit.owner =
                state.owner;

            state.digit.noCorrectionNeeded =
                state.noCorrectionNeeded;

        }
    );

}


/* =====================================================
   訂正時 全体カウント＋2
===================================================== */

function boostAllCounters(
    correctedDigit
) {

    digits.forEach(
        digit => {

            if (
                !digit.filled
            ) {

                return;

            }


            if (
                digit.noCorrectionNeeded
            ) {

                return;

            }


            if (
                digit === correctedDigit
            ) {

                return;

            }


            digit.counter =
                Math.min(
                    5,
                    digit.counter + 2
                );

        }
    );


    correctedDigit.counter =
        5;

}


/* =====================================================
   訂正不要状態更新
===================================================== */

function updateCorrectionStates() {

    digits.forEach(
        digit => {

            checkNoCorrectionNeeded(
                digit
            );

        }
    );

}


/* =====================================================
   訂正不要判定
===================================================== */

function checkNoCorrectionNeeded(
    digit
) {

    if (
        !digit.filled
    ) {

        digit.noCorrectionNeeded =
            false;

        return;

    }


    /*
       9ならその桁は上げられない
    */

    if (
        digit.value === 9
    ) {

        digit.noCorrectionNeeded =
            true;

        return;

    }


    const number =
        getCurrentNumber();


    const amount =
        Math.pow(
            10,
            -digit.position
        );


    const increased =
        number + amount;


    if (
        increased * increased
        >
        x
    ) {

        digit.noCorrectionNeeded =
            true;

    }

    else {

        digit.noCorrectionNeeded =
            false;

    }

}


/* =====================================================
   カウント減少
===================================================== */

function advanceCounters(
    resetDigit
) {

    digits.forEach(
        digit => {

            if (
                !digit.filled
            ) {

                return;

            }


            if (
                digit === resetDigit
            ) {

                return;

            }


            if (
                digit.noCorrectionNeeded
            ) {

                return;

            }


            if (
                digit.counter > 0
            ) {

                digit.counter--;

            }

        }
    );

}


/* =====================================================
   カウント0
===================================================== */

function checkCounterZero() {

    for (
        const digit of digits
    ) {

        if (
            digit.filled
            &&
            !digit.noCorrectionNeeded
            &&
            digit.counter <= 0
        ) {

            endGame(
                `小数第${digit.position}位の値が5ターンの間修正されませんでした。`,
                false
            );


            return true;

        }

    }


    return false;

}


/* =====================================================
   次のプレイヤー
===================================================== */

function nextTurn() {

    if (
        turnOrder.length <= 1
    ) {

        return;

    }


    let safety = 0;


    do {

        currentTurnIndex =
            (
                currentTurnIndex + 1
            )
            %
            turnOrder.length;


        safety++;

    }

    while (
        currentPlayer().eliminated
        &&
        safety <= turnOrder.length
    );

}


/* =====================================================
   全員失格
===================================================== */

function checkElimination() {

    const alive =
        players.filter(
            player =>
                !player.eliminated
        );


    /*
       1人プレイの場合
    */

    if (
        players.length === 1
    ) {

        endGame(
            "プレイヤーが失格しました。",
            false
        );

        return true;

    }


    /*
       全員失格
    */

    if (
        alive.length === 0
    ) {

        endGame(
            "全員が失格になりました。",
            false
        );

        return true;

    }


    /*
       1人を除いて全員失格
       
       これはGAME OVER。
       残った人を「優勝者」としない。
    */

    if (
        alive.length === 1
    ) {

        endGame(
            `${alive[0].name()}以外が全員失格になりました。`,
            false
        );

        return true;

    }


    return false;

}


/* =====================================================
   メッセージ
===================================================== */

function showMessage(text) {

    document
    .getElementById("message")
    .textContent =
        text;

}


/* =====================================================
   ゲーム終了
===================================================== */

function endGame(
    reason,
    clear
) {

    if (
        !gameStarted
    ) {

        return;

    }


    gameStarted = false;


    stopTimer();


    /*
       タイマー最終更新
    */

    updateTimer();


    const finalNumber =
        getCurrentNumber();


    /*
       CLEAR / GAME OVER
    */

    const endTitle =
        document
        .getElementById("endTitle");


    if (
        clear
    ) {

        endTitle.textContent =
            "GAME CLEAR";

    }

    else {

        endTitle.textContent =
            "GAME OVER";

    }


    let html =
        `<p>${reason}</p>`;


    html +=
        `
        <p>
        √${x} =
        ${formatNumber(sqrtX)}
        <br>
        最終予測値 =
        ${getDisplayNumber()}
        </p>
        `;


    /*
       タイムトライアル
    */

    if (
        gameMode === "time"
    ) {

        const finalTime =
            elapsedSeconds
            +
            timePenalty;


        html +=
            `
            <h2>
                タイム：
                ${formatTime(finalTime)}
            </h2>
            `;

    }


    /*
       スコアありの場合だけ表示
    */

    if (
        scoreEnabled
    ) {

        const ranking =
            [...players]
            .sort(
                (a, b) =>
                    b.score - a.score
            );


        /*
           失格者を勝者として扱わない。
        */

        const alive =
            ranking.filter(
                player =>
                    !player.eliminated
            );


        if (
            clear
            &&
            alive.length > 0
        ) {

            const winner =
                alive[0];


            html =
                `<h2>🏆 勝者：${winner.name()}</h2>`
                +
                html;

        }


        html +=
            `<h2>最終ポイント</h2>`;


        ranking.forEach(
            (player, index) => {

                html +=
                    `
                    <p>
                    ${index + 1}位　
                    ${player.name()}　
                    ${player.score}pt
                    ${
                        player.eliminated
                        ? "（失格）"
                        : ""
                    }
                    </p>
                    `;

            }
        );

    }


    document
    .getElementById("gameScreen")
    .classList
    .add("hidden");


    document
    .getElementById("endScreen")
    .classList
    .remove("hidden");


    document
    .getElementById("result")
    .innerHTML =
        html;

}


/* =====================================================
   時間表示
===================================================== */

function formatTime(seconds) {

    const minutes =
        Math.floor(
            seconds / 60
        );


    const sec =
        seconds % 60;


    return (
        String(minutes)
        .padStart(2, "0")
        +
        ":"
        +
        sec.toFixed(2)
            .padStart(5, "0")
    );

}
