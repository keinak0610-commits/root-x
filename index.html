<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>√x</title>

<style>

/* =====================================================
   全体
===================================================== */

body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;

    background: #f2f2f2;

    margin: 0;

    padding: 15px;

    color: #222;
}


.container {

    max-width: 900px;

    margin: auto;

    background: white;

    padding: 20px;

    border-radius: 15px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,0.15);
}


h1 {

    text-align: center;

    margin-top: 5px;
}


.center {

    text-align: center;
}


/* =====================================================
   ボタン
===================================================== */

button {

    font-size: 17px;

    padding: 11px 18px;

    margin: 5px;

    border-radius: 8px;

    border: 1px solid #888;

    background: white;

    cursor: pointer;
}


button:active {

    transform: scale(0.97);
}


/* =====================================================
   セレクト
===================================================== */

select {

    font-size: 18px;

    padding: 8px;
}


/* =====================================================
   ゲーム画面
===================================================== */

#gameArea {

    text-align: center;

    padding: 15px;

    border: 2px solid #444;

    border-radius: 12px;

    background: #fafafa;
}


#sqrtQuestion {

    font-size: 28px;

    font-weight: bold;

    margin-top: 10px;
}


#turnDisplay {

    margin-top: 20px;

    font-size: 22px;
}


/* =====================================================
   現在の数字
===================================================== */

#currentNumber {

    font-size: 30px;

    font-family: monospace;

    margin: 20px 0;

    white-space: nowrap;

    overflow-x: auto;

    padding: 8px 4px;

    -webkit-overflow-scrolling: touch;
}


.decimal-label {

    font-size: 30px;

    font-family: monospace;
}


/* =====================================================
   小数入力ボックス
===================================================== */

.digit-box {

    width: 45px;

    height: 50px;

    font-size: 28px;

    line-height: 46px;

    text-align: center;

    padding: 0;

    margin: 3px;

    border: 2px solid #777;

    border-radius: 6px;

    box-sizing: border-box;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;
}


.digit-box:focus {

    outline: none;

    border: 3px solid #333;
}


/* =====================================================
   カウント警告
===================================================== */

#warning {

    margin-top: 15px;

    padding: 12px;

    border-radius: 8px;

    background: #fff7d6;

    border: 2px solid #d6a900;

    color: #765900;

    font-weight: bold;

    white-space: pre-line;
}


/* =====================================================
   二乗値
===================================================== */

#squareDisplay {

    margin-top: 15px;

    padding: 10px;

    border-radius: 8px;

    background: #eaeaea;

    font-size: 18px;
}


.safe {

    color: green;

    font-weight: bold;
}


.over {

    color: red;

    font-weight: bold;
}


/* =====================================================
   メッセージ
===================================================== */

#message {

    margin-top: 15px;

    padding: 10px;

    border-radius: 8px;

    background: #eee;
}


/* =====================================================
   ボーナス
===================================================== */

#bonusLog {

    margin-top: 15px;

    min-height: 25px;

    font-weight: bold;
}


/* =====================================================
   ポイント表
===================================================== */

#playerTable {

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 10px;

    margin-top: 15px;
}


.player-card {

    width: 115px;

    min-height: 75px;

    border: 2px solid #555;

    border-radius: 10px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    background: white;

    box-sizing: border-box;
}


.player-number {

    font-size: 17px;

    font-weight: bold;
}


.player-score {

    font-size: 24px;

    margin-top: 5px;
}


.player-card.eliminated {

    opacity: 0.4;

    text-decoration: line-through;
}


/* =====================================================
   終了画面
===================================================== */

#result {

    font-size: 18px;

    line-height: 1.7;
}


.hidden {

    display: none;
}


/* =====================================================
   スマートフォン
===================================================== */

@media (max-width: 600px) {

    body {

        padding: 8px;
    }


    .container {

        padding: 12px;
    }


    #currentNumber {

        white-space: nowrap;

        overflow-x: auto;

        padding: 8px 4px;
    }


    .digit-box {

        width: 40px;

        height: 48px;

        font-size: 26px;

        line-height: 44px;

        margin: 2px;
    }


    .decimal-label {

        font-size: 27px;
    }


    #turnDisplay {

        font-size: 20px;
    }


    #sqrtQuestion {

        font-size: 25px;
    }


    #squareDisplay {

        font-size: 16px;
    }

}

</style>

</head>


<body>


<div class="container">


<!-- =====================================================
     開始画面
===================================================== -->

<div id="startScreen">

    <h1>√x</h1>

    <div class="center">

        <p>
            √xの値を1桁ずつ予測するゲームです。
        </p>

        <p>
            予測した桁の値だけ、ポイントが入ります。
        </p>

        <p>
            <strong>75点先取です。</strong>
        </p>

        <br>

        <label>
            プレイヤー人数：
        </label>

        <select id="playerCount">

            <option value="1" selected>
                1人
            </option>

            <option value="2">
                2人
            </option>

            <option value="3">
                3人
            </option>

            <option value="4">
                4人
            </option>

            <option value="5">
                5人
            </option>

            <option value="6">
                6人
            </option>

            <option value="7">
                7人
            </option>

            <option value="8">
                8人
            </option>

        </select>

        <br><br>

        <button onclick="startGame()">
            ゲーム開始
        </button>

    </div>

</div>


<!-- =====================================================
     ゲーム画面
===================================================== -->

<div id="gameScreen"
     class="hidden">


    <div id="gameArea">


        <h1>√x</h1>


        <div id="sqrtQuestion">
        </div>


        <h2 id="turnDisplay">
        </h2>


        <div id="currentNumber">
        </div>


        <div id="squareDisplay">
        </div>


        <div id="warning"
             class="hidden">
        </div>


        <button onclick="confirmTurn()">
            この桁を確定
        </button>


        <div id="message">
        </div>


        <div id="bonusLog">
        </div>

    </div>


    <!-- ポイント表 -->

    <h2 class="center">
        ポイント
    </h2>


    <div id="playerTable">
    </div>


</div>


<!-- =====================================================
     終了画面
===================================================== -->

<div id="endScreen"
     class="hidden">

    <h1>
        GAME OVER
    </h1>


    <div id="result">
    </div>


    <div class="center">

        <button onclick="location.reload()">
            もう一度遊ぶ
        </button>

    </div>

</div>


</div>


<script>


/* =====================================================
   プレイヤー
===================================================== */

class Player {

    constructor(number) {

        this.number = number;

        this.score = 0;

        this.eliminated = false;
    }


    name() {

        return "プレイヤー" + this.number;

    }

}


/* =====================================================
   小数各桁
===================================================== */

class Digit {

    constructor(position) {

        this.position = position;

        this.value = null;

        this.counter = 5;

        this.owner = null;

        this.filled = false;

        this.noCorrectionNeeded = false;
    }

}


/* =====================================================
   ゲーム変数
===================================================== */

let x;

let sqrtX;

let integerPart;

let players = [];

let turnOrder = [];

let currentTurnIndex = 0;

let digits = [];

let gameStarted = false;


/* =====================================================
   ゲーム開始
===================================================== */

function startGame() {

    const count =
        Number(
            document
            .getElementById("playerCount")
            .value
        );


    /*
        1～1000
        平方数を除外
    */

    let candidates = [];


    for (
        let i = 1;
        i <= 1000;
        i++
    ) {

        if (
            !Number.isInteger(
                Math.sqrt(i)
            )
        ) {

            candidates.push(i);

        }

    }


    /*
        x決定
    */

    x =
        candidates[
            Math.floor(
                Math.random()
                *
                candidates.length
            )
        ];


    sqrtX =
        Math.sqrt(x);


    integerPart =
        Math.floor(sqrtX);


    /*
        プレイヤー
    */

    players = [];


    for (
        let i = 1;
        i <= count;
        i++
    ) {

        players.push(
            new Player(i)
        );

    }


    /*
        番号順
    */

    turnOrder =
        [...players];


    currentTurnIndex = 0;


    /*
        小数第1～10位
    */

    digits = [];


    for (
        let i = 1;
        i <= 10;
        i++
    ) {

        digits.push(
            new Digit(i)
        );

    }


    gameStarted = true;


    document
    .getElementById("startScreen")
    .classList
    .add("hidden");


    document
    .getElementById("gameScreen")
    .classList
    .remove("hidden");


    /*
        √〇〇〇 = ？
    */

    document
    .getElementById("sqrtQuestion")
    .textContent =
        `√${x} = ？`;


    updateAll();


    showMessage(
        "小数第1位を予測してください。"
    );

}


/* =====================================================
   現在のプレイヤー
===================================================== */

function currentPlayer() {

    return turnOrder[currentTurnIndex];

}


/* =====================================================
   全体更新
===================================================== */

function updateAll() {

    updateTurn();

    updateNumber();

    updateSquare();

    updateWarning();

    updatePlayers();

}


/* =====================================================
   ターン表示
===================================================== */

function updateTurn() {

    while (
        currentPlayer().eliminated
    ) {

        currentTurnIndex =
            (
                currentTurnIndex + 1
            )
            %
            turnOrder.length;

    }


    document
    .getElementById("turnDisplay")
    .textContent =
        currentPlayer().name()
        + " のターン";

}


/* =====================================================
   数字表示
===================================================== */

function updateNumber() {

    const area =
        document
        .getElementById("currentNumber");


    area.innerHTML = "";


    /*
        整数部分
    */

    const integer =
        document.createElement("span");


    integer.className =
        "decimal-label";


    integer.textContent =
        integerPart + ".";


    area.appendChild(integer);


    /*
        小数部分
    */

    for (
        let i = 0;
        i < digits.length;
        i++
    ) {

        const digit =
            digits[i];


        /*
            前の桁が未入力なら
            それ以降は表示しない
        */

        if (
            i > 0
            &&
            !digits[i - 1].filled
        ) {

            break;

        }


        const input =
            document.createElement("input");


        input.type = "text";

        input.inputMode = "numeric";

        input.maxLength = 1;

        input.className = "digit-box";

        input.dataset.position =
            digit.position;


        if (
            digit.value !== null
        ) {

            input.value =
                digit.value;

        }


        input.addEventListener(
            "input",
            function() {

                this.value =
                    this.value
                    .replace(
                        /[^0-9]/g,
                        ""
                    )
                    .slice(
                        0,
                        1
                    );

            }
        );


        area.appendChild(input);

    }

}


/* =====================================================
   現在の数字
===================================================== */

function getCurrentNumber() {

    let number =
        integerPart;


    for (
        let i = 0;
        i < 10;
        i++
    ) {

        if (
            digits[i].filled
        ) {

            number +=
                digits[i].value
                *
                Math.pow(
                    10,
                    -(i + 1)
                );

        }
        else {

            break;

        }

    }


    return number;

}


/* =====================================================
   二乗値
===================================================== */

function updateSquare() {

    const number =
        getCurrentNumber();


    const square =
        number * number;


    const area =
        document
        .getElementById("squareDisplay");


    if (
        square > x
    ) {

        area.className = "over";


        area.innerHTML =
            `
            現在の値：
            ${number.toFixed(10)}
            <br>
            二乗：
            ${square.toFixed(10)}
            <br>
            ⚠️ √xを超えています
            `;

    }
    else {

        area.className = "safe";


        area.innerHTML =
            `
            現在の値：
            ${number.toFixed(10)}
            <br>
            二乗：
            ${square.toFixed(10)}
            <br>
            √x以下
            `;

    }

}


/* =====================================================
   カウント1警告
===================================================== */

function updateWarning() {

    const area =
        document
        .getElementById("warning");


    let warnings = [];


    digits.forEach(
        digit => {

            if (
                digit.filled
                &&
                !digit.noCorrectionNeeded
                &&
                digit.counter === 1
            ) {

                warnings.push(
                    `小数第${digit.position}位`
                );

            }

        }
    );


    if (
        warnings.length > 0
    ) {

        area.classList.remove("hidden");


        area.textContent =
            "このターンで修正しなければいけない値があります。"
            +
            "もし失敗した場合、強制終了となります。"
            +
            "\n対象："
            +
            warnings.join("、");

    }
    else {

        area.classList.add("hidden");

    }

}


/* =====================================================
   プレイヤー表
===================================================== */

function updatePlayers() {

    const area =
        document
        .getElementById("playerTable");


    area.innerHTML = "";


    players.forEach(
        player => {

            const card =
                document.createElement("div");


            card.className =
                "player-card";


            if (
                player.eliminated
            ) {

                card.classList.add(
                    "eliminated"
                );

            }


            card.innerHTML =
                `
                <div class="player-number">
                    ${player.name()}
                </div>

                <div class="player-score">
                    ${player.score} pt
                </div>
                `;


            area.appendChild(card);

        }
    );

}


/* =====================================================
   入力値取得
===================================================== */

function getInputValues() {

    const inputs =
        document.querySelectorAll(
            "#currentNumber .digit-box"
        );


    let result = [];


    inputs.forEach(
        input => {

            result.push({

                position:
                    Number(
                        input.dataset.position
                    ),

                value:
                    input.value === ""
                    ? null
                    : Number(input.value)

            });

        }
    );


    return result;

}


/* =====================================================
   ターン確定
===================================================== */

function confirmTurn() {

    if (
        !gameStarted
    ) {

        return;

    }


    const inputs =
        getInputValues();


    /*
        今回変更された桁
    */

    let changed = [];


    inputs.forEach(
        item => {

            const digit =
                digits[
                    item.position - 1
                ];


            const oldValue =
                digit.value;


            if (
                item.value !== oldValue
            ) {

                changed.push({

                    digit: digit,

                    newValue:
                        item.value,

                    oldValue:
                        oldValue

                });

            }

        }
    );


    /*
        変更なし
    */

    if (
        changed.length === 0
    ) {

        showMessage(
            "数字を1つ以上変更してください。"
        );

        return;

    }


    /*
        最も上位の変更桁
    */

    changed.sort(
        (a, b) =>
            a.digit.position
            -
            b.digit.position
    );


    const highestChanged =
        changed[0];


    const highestPosition =
        highestChanged
        .digit
        .position;


    /*
        最も上位の変更桁より
        上位を変更していないか確認

        changedの中で最上位なので
        この条件は自然に満たされる
    */


    /*
        下位桁だけ変更可能。

        ただし、新しく表示された
        下位桁まで勝手に変更することは
        許可する。

        「最上位の変更桁より上」
        が変更されていなければOK。
    */


    /*
        変更値の妥当性を確認
    */

    for (
        const change
        of changed
    ) {

        const digit =
            change.digit;


        const newValue =
            change.newValue;


        /*
            空白
        */

        if (
            newValue === null
        ) {

            showMessage(
                "変更する桁には数字を入力してください。"
            );

            updateAll();

            return;

        }


        /*
            既存値の訂正なら
            必ず大きくする
        */

        if (
            digit.filled
            &&
            newValue <= digit.value
        ) {

            showMessage(
                `小数第${digit.position}位は、`
                +
                `現在の値より大きくしてください。`
            );

            updateAll();

            return;

        }

    }


    /*
        ★重要★

        最上位の変更桁が
        「訂正」なのか
        「新規宣言」なのか
    */

    const highestIsCorrection =
        highestChanged
        .digit
        .filled;


    /*
        変更された全桁を一時的に保存
    */

    const oldStates =
        changed.map(
            change => ({

                digit:
                    change.digit,

                value:
                    change.digit.value,

                filled:
                    change.digit.filled,

                counter:
                    change.digit.counter,

                owner:
                    change.digit.owner,

                noCorrectionNeeded:
                    change.digit
                    .noCorrectionNeeded

            })
        );


    /*
        変更を適用
    */

    changed.forEach(
        change => {

            change.digit.value =
                change.newValue;

            change.digit.filled =
                true;

        }
    );


    /*
        現在の数字
    */

    const currentNumber =
        getCurrentNumber();


    const square =
        currentNumber
        *
        currentNumber;


    /*
        二乗判定
    */

    if (
        square > x
    ) {

        /*
            全変更を元に戻す
        */

        oldStates.forEach(
            state => {

                state.digit.value =
                    state.value;

                state.digit.filled =
                    state.filled;

                state.digit.counter =
                    state.counter;

                state.digit.owner =
                    state.owner;

                state.digit
                    .noCorrectionNeeded =
                    state.noCorrectionNeeded;

            }
        );


        currentPlayer()
            .eliminated =
            true;


        alert(
            `${currentPlayer().name()}は失格です。\n\n`
            +
            `現在の値：${currentNumber}\n`
            +
            `二乗：${square}\n`
            +
            `x：${x}`
        );


        if (
            checkElimination()
        ) {

            return;

        }


        nextTurn();

        updateAll();

        return;

    }


    /*
        =================================================
        成功
        =================================================
    */

    const player =
        currentPlayer();


    /*
        ★ポイント★

        最も上位の変更桁だけ
        ポイント対象

        例：
        1.234 → 1.567

        第2位の「5」のみ
        5ポイント
    */

    const pointDigit =
        highestChanged
        .newValue;


    player.score +=
        pointDigit;


    /*
        その桁の所有者
    */

    highestChanged
        .digit
        .owner =
        player;


    /*
        =================================================
        新規宣言
        =================================================
    */

    if (
        !highestIsCorrection
    ) {

        highestChanged
            .digit
            .counter =
            5;

    }


    /*
        =================================================
        訂正
        =================================================
    */

    if (
        highestIsCorrection
    ) {

        const oldValue =
            highestChanged.oldValue;


        const newValue =
            highestChanged.newValue;


        /*
            訂正した最上位桁
            → 5にリセット
        */

        highestChanged
            .digit
            .counter =
            5;


        /*
            大幅修正ボーナス
        */

        if (
            newValue - oldValue >= 5
        ) {

            player.score += 2;


            document
            .getElementById("bonusLog")
            .textContent =
                `（${player.name()}、大幅修正ボーナス獲得）`;

        }


        /*
            ★新仕様★

            訂正したら、
            進行中の全カウントを+2

            最大5
        */

        boostAllCounters(
            highestChanged.digit
        );

    }


    /*
        =================================================
        下位桁の処理
        =================================================

        下位桁を変更した場合、
        ポイントは入れない。

        ただし、その桁自体の値は
        正式に更新される。
    */


    changed.forEach(
        change => {

            const digit =
                change.digit;


            if (
                digit !==
                highestChanged.digit
            ) {

                /*
                    下位桁については
                    新しい値を保持する。

                    カウントは新しく
                    宣言された桁なら5。
                */

                if (
                    !oldStates.find(
                        state =>
                            state.digit === digit
                            &&
                            state.filled
                    )
                ) {

                    digit.counter =
                        5;

                }

            }

        }
    );


    /*
        訂正不要判定
    */

    changed.forEach(
        change => {

            checkNoCorrectionNeeded(
                change.digit
            );

        }
    );


    /*
        75点
    */

    if (
        player.score >= 75
    ) {

        endGame(
            `${player.name()}が75点を先取しました。`
        );

        return;

    }


    /*
        小数10桁到達
    */

    const maxPosition =
        Math.max(
            ...changed.map(
                change =>
                    change.digit.position
            )
        );


    if (
        maxPosition === 10
    ) {

        endGame(
            "小数10桁目に到達しました。"
        );

        return;

    }


    /*
        通常のカウント減少
    */

    advanceCounters(
        highestChanged.digit
    );


    /*
        0確認
    */

    if (
        checkCounterZero()
    ) {

        return;

    }


    /*
        次のプレイヤー
    */

    nextTurn();


    updateAll();


    /*
        メッセージ
    */

    if (
        highestIsCorrection
    ) {

        showMessage(
            `${player.name()}が`
            +
            `小数第${highestPosition}位を訂正しました。`
            +
            `下位の桁も更新されています。`
        );

    }
    else {

        showMessage(
            `${player.name()}が`
            +
            `小数第${highestPosition}位を宣言しました。`
        );

    }

}


/* =====================================================
   訂正時の全カウント+2
===================================================== */

function boostAllCounters(
    correctedDigit
) {

    digits.forEach(
        digit => {

            /*
                未入力は対象外
            */

            if (
                !digit.filled
            ) {

                return;

            }


            /*
                訂正不要な桁
            */

            if (
                digit.noCorrectionNeeded
            ) {

                return;

            }


            /*
                訂正した桁自身は
                下で5にするため、
                ここでは+2しない
            */

            if (
                digit ===
                correctedDigit
            ) {

                return;

            }


            /*
                +2
                最大5
            */

            digit.counter =
                Math.min(
                    5,
                    digit.counter + 2
                );

        }
    );


    /*
        訂正した桁は5
    */

    correctedDigit.counter =
        5;

}


/* =====================================================
   訂正不要判定
===================================================== */

function checkNoCorrectionNeeded(
    digit
) {

    /*
        9ならそれ以上増やせない
    */

    if (
        digit.value === 9
    ) {

        digit.noCorrectionNeeded =
            true;

        return;

    }


    const number =
        getCurrentNumber();


    /*
        現在の桁を+1
    */

    const increased =
        number
        +
        Math.pow(
            10,
            -digit.position
        );


    /*
        +1すると√xを超える
    */

    if (
        increased
        *
        increased
        >
        x
    ) {

        digit.noCorrectionNeeded =
            true;

    }
    else {

        digit.noCorrectionNeeded =
            false;

    }

}


/* =====================================================
   カウント減少
===================================================== */

function advanceCounters(
    resetDigit
) {

    digits.forEach(
        digit => {

            if (
                !digit.filled
            ) {

                return;

            }


            /*
                今回訂正した桁
            */

            if (
                digit === resetDigit
            ) {

                return;

            }


            /*
                訂正不要
            */

            if (
                digit.noCorrectionNeeded
            ) {

                return;

            }


            if (
                digit.counter > 0
            ) {

                digit.counter--;

            }

        }
    );

}


/* =====================================================
   カウント0確認
===================================================== */

function checkCounterZero() {

    for (
        const digit
        of digits
    ) {

        if (
            digit.filled
            &&
            !digit.noCorrectionNeeded
            &&
            digit.counter <= 0
        ) {

            endGame(
                `小数第${digit.position}位の値が`
                +
                `5ターンの間修正されませんでした。`
            );

            return true;

        }

    }


    return false;

}


/* =====================================================
   次のターン
===================================================== */

function nextTurn() {

    currentTurnIndex =
        (
            currentTurnIndex + 1
        )
        %
        turnOrder.length;


    /*
        失格者を飛ばす
    */

    while (
        currentPlayer().eliminated
    ) {

        currentTurnIndex =
            (
                currentTurnIndex + 1
            )
            %
            turnOrder.length;

    }

}


/* =====================================================
   全員失格確認
===================================================== */

function checkElimination() {

    const alive =
        players.filter(
            player =>
                !player.eliminated
        );


    if (
        alive.length === 1
    ) {

        endGame(
            `${alive[0].name()}以外が全員失格になりました。`
        );

        return true;

    }


    if (
        alive.length === 0
    ) {

        endGame(
            "全員が失格になりました。"
        );

        return true;

    }


    return false;

}


/* =====================================================
   メッセージ
===================================================== */

function showMessage(text) {

    document
    .getElementById("message")
    .textContent =
        text;

}


/* =====================================================
   ゲーム終了
===================================================== */

function endGame(reason) {

    gameStarted = false;


    const finalNumber =
        getCurrentNumber();


    /*
        ポイント順
    */

    const ranking =
        [...players].sort(
            (a, b) =>
                b.score - a.score
        );


    const winner =
        ranking[0];


    let html =
        `<h2>🏆 勝者：${winner.name()}</h2>`;


    html +=
        `<p>${reason}</p>`;


    html +=
        `
        <p>
        √${x} =
        ${sqrtX.toFixed(12)}
        <br>
        最終予測値 =
        ${finalNumber.toFixed(10)}
        </p>
        `;


    html +=
        `<h2>最終ポイント</h2>`;


    ranking.forEach(
        (player, index) => {

            html +=
                `
                <p>
                ${index + 1}位　
                ${player.name()}　
                ${player.score}pt
                ${
                    player.eliminated
                    ? "（失格）"
                    : ""
                }
                </p>
                `;

        }
    );


    document
    .getElementById("gameScreen")
    .classList
    .add("hidden");


    document
    .getElementById("endScreen")
    .classList
    .remove("hidden");


    document
    .getElementById("result")
    .innerHTML =
        html;

}


</script>
