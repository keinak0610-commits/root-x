<script>

/* =====================================================
   言語
===================================================== */

let language =
    localStorage.getItem("rootXLanguage")
    || "ja";


function translatePage() {

    document.documentElement.lang =
        language;


    document
    .querySelectorAll("[data-ja]")
    .forEach(element => {

        const text =
            element.dataset[
                language === "ja"
                ? "ja"
                : "en"
            ];

        if (
            text !== undefined
        ) {

            element.innerHTML =
                text;

        }

    });

}


function changeLanguage() {

    language =
        document
        .getElementById("languageSelect")
        .value;


    localStorage.setItem(
        "rootXLanguage",
        language
    );


    translatePage();


    updateGameTexts();

}


/* =====================================================
   BGM
===================================================== */

let audioContext = null;

let masterGain = null;

let bgmTimer = null;

let bgmStarted = false;


const melody = [
    261.63,
    329.63,
    392.00,
    523.25,
    392.00,
    329.63,
    293.66,
    392.00
];


let melodyIndex = 0;


function startBGM() {

    if (
        bgmStarted
    ) {

        return;

    }


    const AudioContext =
        window.AudioContext
        ||
        window.webkitAudioContext;


    if (
        !AudioContext
    ) {

        return;

    }


    audioContext =
        new AudioContext();


    masterGain =
        audioContext.createGain();


    masterGain.gain.value =
        Number(
            document
            .getElementById("volumeSlider")
            .value
        )
        /
        100
        *
        0.12;


    masterGain.connect(
        audioContext.destination
    );


    bgmStarted = true;


    playNextNote();

}


function playNextNote() {

    if (
        !audioContext
        ||
        !masterGain
    ) {

        return;

    }


    const oscillator =
        audioContext.createOscillator();


    const gain =
        audioContext.createGain();


    oscillator.type =
        "sine";


    oscillator.frequency.value =
        melody[
            melodyIndex
        ];


    gain.gain.setValueAtTime(
        0,
        audioContext.currentTime
    );


    gain.gain.linearRampToValueAtTime(
        1,
        audioContext.currentTime + 0.04
    );


    gain.gain.linearRampToValueAtTime(
        0,
        audioContext.currentTime + 0.45
    );


    oscillator.connect(gain);

    gain.connect(masterGain);


    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + 0.5
    );


    melodyIndex =
        (
            melodyIndex + 1
        )
        %
        melody.length;


    bgmTimer =
        setTimeout(
            playNextNote,
            500
        );

}


function changeVolume() {

    const value =
        Number(
            document
            .getElementById("volumeSlider")
            .value
        );


    document
    .getElementById("volumeValue")
    .textContent =
        value;


    localStorage.setItem(
        "rootXVolume",
        value
    );


    if (
        masterGain
    ) {

        masterGain.gain.value =
            value / 100 * 0.12;

    }

}


/* =====================================================
   プレイヤー
===================================================== */

class Player {

    constructor(number) {

        this.number = number;

        this.score = 0;

        this.eliminated = false;

    }


    name() {

        if (
            language === "ja"
        ) {

            return "プレイヤー" +
                   this.number;

        }

        return "Player " +
               this.number;

    }

}


/* =====================================================
   桁
===================================================== */

class Digit {

    constructor(position) {

        this.position = position;

        this.value = null;

        this.filled = false;

        this.counter = 5;

        this.owner = null;

        this.noCorrectionNeeded = false;

    }

}


/* =====================================================
   ゲーム変数
===================================================== */

let x;

let sqrtX;

let integerPart;

let players = [];

let turnOrder = [];

let currentTurnIndex = 0;

let digits = [];

let gameStarted = false;

let gameMode = "normal";

let infiniteScoreEnabled = true;

let timerStart = 0;

let timerInterval = null;

let elapsedSeconds = 0;

let penaltySeconds = 0;

let overFlag = false;


/* =====================================================
   モード選択
===================================================== */

function selectMode(mode) {

    gameMode =
        mode;


    if (
        mode === "infinite"
    ) {

        infiniteScoreEnabled =
            document
            .getElementById("infiniteScore")
            .value === "yes";

    }


    startGame();

}


/* =====================================================
   ゲーム開始
===================================================== */

function startGame() {

    startBGM();


    const count =
        Number(
            document
            .getElementById("playerCount")
            ?.value
            || 1
        );


    const candidates = [];


    for (
        let i = 1;
        i <= 1000;
        i++
    ) {

        if (
            !Number.isInteger(
                Math.sqrt(i)
            )
        ) {

            candidates.push(i);

        }

    }


    x =
        candidates[
            Math.floor(
                Math.random()
                *
                candidates.length
            )
        ];


    sqrtX =
        Math.sqrt(x);


    integerPart =
        Math.floor(sqrtX);


    players = [];


    for (
        let i = 1;
        i <= count;
        i++
    ) {

        players.push(
            new Player(i)
        );

    }


    turnOrder =
        [...players];


    currentTurnIndex =
        0;


    digits = [];


    for (
        let i = 1;
        i <= 10;
        i++
    ) {

        digits.push(
            new Digit(i)
        );

    }


    gameStarted =
        true;


    document
    .getElementById("startScreen")
    .classList
    .add("hidden");


    document
    .getElementById("gameScreen")
    .classList
    .remove("hidden");


    document
    .getElementById("sqrtQuestion")
    .textContent =
        `√${x} = ？`;


    document
    .getElementById("overMessage")
    .classList
    .add("hidden");


    overFlag =
        false;


    penaltySeconds =
        0;


    elapsedSeconds =
        0;


    if (
        gameMode === "time"
        ||
        gameMode === "infinite"
    ) {

        document
        .getElementById("timerDisplay")
        .classList
        .remove("hidden");


        startTimer();

    }

    else {

        document
        .getElementById("timerDisplay")
        .classList
        .add("hidden");

    }


    if (
        gameMode === "infinite"
        &&
        !infiniteScoreEnabled
    ) {

        document
        .getElementById("scoreSection")
        .classList
        .add("hidden");

    }

    else {

        document
        .getElementById("scoreSection")
        .classList
        .remove("hidden");

    }


    updateAll();


    showMessage(
        language === "ja"
        ? "小数第1位を予測してください。"
        : "Predict the first decimal digit."
    );

}


/* =====================================================
   タイマー
===================================================== */

function startTimer() {

    clearInterval(
        timerInterval
    );


    timerStart =
        Date.now();


    timerInterval =
        setInterval(
            updateTimer,
            100
        );

}


function updateTimer() {

    if (
        !gameStarted
    ) {

        return;

    }


    elapsedSeconds =
        (
            Date.now()
            -
            timerStart
        )
        /
        1000;


    const total =
        elapsedSeconds
        +
        penaltySeconds;


    document
    .getElementById("timerDisplay")
    .textContent =
        formatTime(total);

}


function formatTime(seconds) {

    const minutes =
        Math.floor(
            seconds / 60
        );


    const sec =
        Math.floor(
            seconds % 60
        );


    const ms =
        Math.floor(
            (
                seconds
                -
                Math.floor(seconds)
            )
            *
            100
        );


    return (
        String(minutes)
        .padStart(2, "0")
        +
        ":"
        +
        String(sec)
        .padStart(2, "0")
        +
        "."
        +
        String(ms)
        .padStart(2, "0")
    );

}


/* =====================================================
   現在プレイヤー
===================================================== */

function currentPlayer() {

    return turnOrder[
        currentTurnIndex
    ];

}


/* =====================================================
   全体更新
===================================================== */

function updateAll() {

    updateTurn();

    updateNumber();

    updateSquare();

    updateWarning();

    updatePlayers();

}


/* =====================================================
   ターン
===================================================== */

function updateTurn() {

    let safety = 0;


    while (
        currentPlayer()
        &&
        currentPlayer().eliminated
        &&
        safety < 20
    ) {

        currentTurnIndex =
            (
                currentTurnIndex + 1
            )
            %
            turnOrder.length;

        safety++;

    }


    if (
        currentPlayer()
    ) {

        document
        .getElementById("turnDisplay")
        .textContent =
            currentPlayer().name()
            +
            (
                language === "ja"
                ? " のターン"
                : "'s turn"
            );

    }

}


/* =====================================================
   数字表示
===================================================== */

function updateNumber() {

    const area =
        document
        .getElementById("currentNumber");


    area.innerHTML = "";


    const integer =
        document.createElement("span");


    integer.className =
        "decimal-label";


    integer.textContent =
        integerPart + ".";


    area.appendChild(
        integer
    );


    let lastFilled = 0;


    for (
        let i = 0;
        i < digits.length;
        i++
    ) {

        if (
            digits[i].filled
        ) {

            lastFilled =
                i + 1;

        }
        else {

            break;

        }

    }


    const maxDigits =
        gameMode === "time"
        ? 7
        : 10;


    const displayCount =
        Math.min(
            lastFilled + 1,
            maxDigits
        );


    for (
        let i = 0;
        i < displayCount;
        i++
    ) {

        const digit =
            digits[i];


        const input =
            document.createElement("input");


        input.type =
            "text";


        input.inputMode =
            "numeric";


        input.maxLength =
            1;


        input.className =
            "digit-box";


        input.dataset.position =
            digit.position;


        if (
            digit.filled
        ) {

            input.value =
                digit.value;

        }


        input.addEventListener(
            "input",
            function() {

                this.value =
                    this.value
                    .replace(
                        /[^0-9]/g,
                        ""
                    )
                    .slice(
                        0,
                        1
                    );

            }
        );


        area.appendChild(
            input
        );

    }

}


/* =====================================================
   現在値
===================================================== */

function getCurrentNumber() {

    let number =
        integerPart;


    for (
        let i = 0;
        i < digits.length;
        i++
    ) {

        if (
            digits[i].filled
        ) {

            number +=
                digits[i].value
                *
                Math.pow(
                    10,
                    -(i + 1)
                );

        }
        else {

            break;

        }

    }


    return number;

}


/* =====================================================
   表示用数値
===================================================== */

function cleanNumber(number) {

    return Number(
        number.toFixed(10)
    ).toString();

}


/* =====================================================
   二乗
===================================================== */

function updateSquare() {

    const number =
        getCurrentNumber();


    const square =
        number * number;


    const area =
        document
        .getElementById("squareDisplay");


    area.className =
        square > x
        ? "over"
        : "safe";


    area.innerHTML =
        `
        <div>
            ${
                language === "ja"
                ? "現在の値："
                : "Current value: "
            }
            ${cleanNumber(number)}
        </div>

        <div>
            ${
                language === "ja"
                ? "二乗："
                : "Square: "
            }
            ${cleanNumber(square)}
        </div>
        `;

}


/* =====================================================
   警告
===================================================== */

function updateWarning() {

    const area =
        document
        .getElementById("warning");


    const warnings = [];


    digits.forEach(
        digit => {

            if (
                digit.filled
                &&
                !digit.noCorrectionNeeded
                &&
                digit.counter === 1
            ) {

                warnings.push(
                    digit.position
                );

            }

        }
    );


    if (
        warnings.length > 0
    ) {

        area.classList.remove(
            "hidden"
        );


        area.textContent =
            language === "ja"
            ? "次のターンまでに修正しなければいけない位があります"
            : "There are digits that must be corrected before the next turn.";

    }

    else {

        area.classList.add(
            "hidden"
        );

    }

}


/* =====================================================
   プレイヤー
===================================================== */

function updatePlayers() {

    const area =
        document
        .getElementById("playerTable");


    area.innerHTML = "";


    players.forEach(
        player => {

            const card =
                document.createElement("div");


            card.className =
                "player-card";


            if (
                player.eliminated
            ) {

                card.classList.add(
                    "eliminated"
                );

            }


            card.innerHTML =
                `
                <div class="player-number">
                    ${player.name()}
                </div>

                <div class="player-score">
                    ${player.score} pt
                </div>
                `;


            area.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   入力値
===================================================== */

function getInputValues() {

    const inputs =
        document.querySelectorAll(
            "#currentNumber .digit-box"
        );


    const result = [];


    inputs.forEach(
        input => {

            result.push({

                position:
                    Number(
                        input.dataset.position
                    ),

                value:
                    input.value === ""
                    ? null
                    : Number(
                        input.value
                    )

            });

        }
    );


    return result;

}


/* =====================================================
   ターン確定
===================================================== */

function confirmTurn() {

    if (
        !gameStarted
    ) {

        return;

    }


    const inputs =
        getInputValues();


    let lastFilledPosition =
        0;


    for (
        let i = 0;
        i < digits.length;
        i++
    ) {

        if (
            digits[i].filled
        ) {

            lastFilledPosition =
                i + 1;

        }
        else {

            break;

        }

    }


    const changed = [];


    inputs.forEach(
        item => {

            const digit =
                digits[
                    item.position - 1
                ];


            const oldValue =
                digit.value;


            if (
                item.value !== oldValue
            ) {

                changed.push({

                    digit: digit,

                    newValue:
                        item.value,

                    oldValue:
                        oldValue

                });

            }

        }
    );


    if (
        changed.length === 0
    ) {

        showMessage(
            language === "ja"
            ? "数字を1つ以上変更してください。"
            : "Change at least one digit."
        );

        return;

    }


    changed.sort(
        (a,b) =>
            a.digit.position
            -
            b.digit.position
    );


    const highestChanged =
        changed[0];


    const highestPosition =
        highestChanged
        .digit
        .position;


    const isNewDigit =
        !highestChanged
        .digit
        .filled;


    const maxDigits =
        gameMode === "time"
        ? 7
        : 10;


    /* ================================
       新規桁
    ================================ */

    if (
        isNewDigit
    ) {

        if (
            highestPosition
            !==
            lastFilledPosition + 1
        ) {

            showMessage(
                language === "ja"
                ? "桁は1つずつ追加してください。"
                : "Digits must be added one at a time."
            );

            updateAll();

            return;

        }


        if (
            highestPosition > maxDigits
        ) {

            return;

        }


        for (
            const change of changed
        ) {

            if (
                change.digit.position
                >
                highestPosition
            ) {

                showMessage(
                    language === "ja"
                    ? "新しい桁は1ターンにつき1つだけ追加できます。"
                    : "Only one new digit can be added per turn."
                );

                updateAll();

                return;

            }

        }

    }


    /* ================================
       訂正
    ================================ */

    else {

        for (
            const change of changed
        ) {

            if (
                change.digit.position
                <
                highestPosition
            ) {

                showMessage(
                    language === "ja"
                    ? "訂正した桁より上位の桁は変更できません。"
                    : "You cannot change digits above the highest corrected digit."
                );

                updateAll();

                return;

            }


            if (
                change.digit.position
                >
                lastFilledPosition + 1
            ) {

                showMessage(
                    language === "ja"
                    ? "一度に追加できる新しい桁は1つだけです。"
                    : "Only one new digit can be added at a time."
                );

                updateAll();

                return;

            }

        }

    }


    /* ================================
       空白
    ================================ */

    for (
        const change of changed
    ) {

        if (
            change.newValue === null
        ) {

            if (
                change.digit.position
                !==
                lastFilledPosition
            ) {

                showMessage(
                    language === "ja"
                    ? "空白にできるのは最後の桁だけです。"
                    : "Only the last digit can be cleared."
                );

                updateAll();

                return;

            }

        }

    }


    const oldStates =
        changed.map(
            change => ({

                digit:
                    change.digit,

                value:
                    change.digit.value,

                filled:
                    change.digit.filled,

                counter:
                    change.digit.counter,

                owner:
                    change.digit.owner,

                noCorrectionNeeded:
                    change.digit
                    .noCorrectionNeeded

            })
        );


    changed.forEach(
        change => {

            change.digit.value =
                change.newValue;


            if (
                change.newValue === null
            ) {

                change.digit.filled =
                    false;

                change.digit.owner =
                    null;

            }

            else {

                change.digit.filled =
                    true;

            }

        }
    );


    const oldNumber =
        getNumberFromStates(
            oldStates
        );


    const newNumber =
        getCurrentNumber();


    /* ================================
       訂正時の大小判定

       重要：
       18 → 20 のような変更を許可
       ================================ */

    if (
        !isNewDigit
        &&
        newNumber <= oldNumber
    ) {

        restoreStates(
            oldStates
        );


        showMessage(
            language === "ja"
            ? "訂正後の値は、訂正前の値より大きくしてください。"
            : "The corrected value must be greater than the previous value."
        );


        updateAll();

        return;

    }


    const square =
        newNumber * newNumber;


    /* ================================
       タイムトライアルのオーバー
    ================================ */

    if (
        gameMode === "time"
        &&
        square > x
    ) {

        restoreStates(
            oldStates
        );


        penaltySeconds +=
            15;


        overFlag =
            true;


        const over =
            document
            .getElementById("overMessage");


        over.classList.remove(
            "hidden"
        );


        over.textContent =
            language === "ja"
            ? "オーバー！　+15秒"
            : "OVER! +15 seconds";


        setTimeout(
            () => {

                over.classList.add(
                    "hidden"
                );

            },
            1800
        );


        updateAll();

        return;

    }


    /* ================================
       通常モードの失格
    ================================ */

    if (
        square > x
    ) {

        restoreStates(
            oldStates
        );


        currentPlayer()
            .eliminated =
            true;


        alert(
            language === "ja"
            ?
            `${currentPlayer().name()}は失格です。\n\n`
            +
            `宣言値：${cleanNumber(newNumber)}\n`
            +
            `二乗：${cleanNumber(square)}\n`
            +
            `x：${x}`
            :
            `${currentPlayer().name()} is eliminated.\n\n`
            +
            `Declared value: ${cleanNumber(newNumber)}\n`
            +
            `Square: ${cleanNumber(square)}\n`
            +
            `x: ${x}`
        );


        if (
            checkElimination()
        ) {

            return;

        }


        nextTurn();

        updateAll();

        return;

    }


    const player =
        currentPlayer();


    /* ================================
       ポイント
    ================================ */

    let point =
        highestChanged.newValue;


    if (
        point === null
    ) {

        point = 0;

    }


    if (
        gameMode !== "time"
        &&
        (
            gameMode !== "infinite"
            ||
            infiniteScoreEnabled
        )
    ) {

        player.score +=
            point;

    }


    if (
        highestChanged.newValue
        !== null
    ) {

        highestChanged
            .digit
            .owner =
            player;

    }


    /* ================================
       新規桁
    ================================ */

    if (
        isNewDigit
    ) {

        highestChanged
            .digit
            .counter =
            5;

        highestChanged
            .digit
            .noCorrectionNeeded =
            false;

    }


    /* ================================
       訂正
    ================================ */

    if (
        !isNewDigit
    ) {

        const oldValue =
            highestChanged.oldValue;


        const newValue =
            highestChanged.newValue;


        highestChanged
            .digit
            .counter =
            5;


        highestChanged
            .digit
            .noCorrectionNeeded =
            false;


        if (
            gameMode !== "time"
            &&
            (
                gameMode !== "infinite"
                ||
                infiniteScoreEnabled
            )
            &&
            newValue !== null
            &&
            oldValue !== null
            &&
            newValue - oldValue >= 5
        ) {

            player.score += 2;


            document
            .getElementById("bonusLog")
            .textContent =
                language === "ja"
                ? `（${player.name()}、大幅修正ボーナス +2）`
                : `(${player.name()}, major correction bonus +2)`;

        }


        boostAllCounters(
            highestChanged.digit
        );

    }


    /* ================================
       空白桁
    ================================ */

    changed.forEach(
        change => {

            const digit =
                change.digit;


            if (
                digit
                !==
                highestChanged.digit
            ) {

                if (
                    change.newValue === null
                ) {

                    digit.filled =
                        false;

                    digit.value =
                        null;

                    digit.counter =
                        5;

                    digit.owner =
                        null;

                    digit.noCorrectionNeeded =
                        false;

                }

            }

        }
    );


    updateCorrectionStates();


    /* ================================
       50点
    ================================ */

    if (
        gameMode === "normal"
        &&
        player.score >= 50
    ) {

        endGame(
            language === "ja"
            ? `${player.name()}が50点を先取しました。`
            : `${player.name()} reached 50 points first.`,
            true
        );

        return;

    }


    /* ================================
       10桁終了
    ================================ */

    if (
        gameMode === "normal"
        &&
        digits[9].filled
    ) {

        endGame(
            language === "ja"
            ? "小数第10位に到達しました。"
            : "The tenth decimal digit was reached.",
            true
        );

        return;

    }


    /* ================================
       タイムトライアル7桁
    ================================ */

    if (
        gameMode === "time"
        &&
        digits[6].filled
    ) {

        const exact =
            getCurrentNumber();


        const correct =
            Math.abs(
                exact - sqrtX
            )
            <
            1e-7;


        if (
            correct
        ) {

            endGame(
                language === "ja"
                ? "小数第7位まで正確に予測しました。"
                : "You accurately predicted all seven decimal places.",
                true
            );

            return;

        }

    }


    /* ================================
       カウント
    ================================ */

    advanceCounters(
        highestChanged.digit
    );


    if (
        checkCounterZero()
    ) {

        return;

    }


    nextTurn();


    updateAll();


    showMessage(
        isNewDigit
        ?
        (
            language === "ja"
            ? `${player.name()}が小数第${highestPosition}位を宣言しました。`
            : `${player.name()} declared decimal digit ${highestPosition}.`
        )
        :
        (
            language === "ja"
            ? `${player.name()}が小数第${highestPosition}位を訂正しました。`
            : `${player.name()} corrected decimal digit ${highestPosition}.`
        )
    );

}


/* =====================================================
   過去状態から数値
===================================================== */

function getNumberFromStates(
    states
) {

    const map =
        new Map();


    states.forEach(
        state => {

            map.set(
                state.digit.position,
                state.value
            );

        }
    );


    let number =
        integerPart;


    for (
        let i = 0;
        i < digits.length;
        i++
    ) {

        const value =
            map.has(i + 1)
            ? map.get(i + 1)
            : digits[i].value;


        if (
            value !== null
            &&
            value !== undefined
        ) {

            number +=
                value
                *
                Math.pow(
                    10,
                    -(i + 1)
                );

        }

        else {

            break;

        }

    }


    return number;

}


/* =====================================================
   状態復元
===================================================== */

function restoreStates(
    states
) {

    states.forEach(
        state => {

            state.digit.value =
                state.value;

            state.digit.filled =
                state.filled;

            state.digit.counter =
                state.counter;

            state.digit.owner =
                state.owner;

            state.digit
                .noCorrectionNeeded =
                state.noCorrectionNeeded;

        }
    );

}


/* =====================================================
   カウント +2
===================================================== */

function boostAllCounters(
    correctedDigit
) {

    digits.forEach(
        digit => {

            if (
                !digit.filled
                ||
                digit.noCorrectionNeeded
                ||
                digit === correctedDigit
            ) {

                return;

            }


            digit.counter =
                Math.min(
                    5,
                    digit.counter + 2
                );

        }
    );


    correctedDigit.counter =
        5;

}


/* =====================================================
   訂正不要判定
===================================================== */

function updateCorrectionStates() {

    digits.forEach(
        digit => {

            checkNoCorrectionNeeded(
                digit
            );

        }
    );

}


function checkNoCorrectionNeeded(
    digit
) {

    if (
        !digit.filled
    ) {

        digit.noCorrectionNeeded =
            false;

        return;

    }


    if (
        digit.value === 9
    ) {

        digit.noCorrectionNeeded =
            true;

        return;

    }


    const number =
        getCurrentNumber();


    const amount =
        Math.pow(
            10,
            -digit.position
        );


    const increased =
        number + amount;


    digit.noCorrectionNeeded =
        increased * increased > x;

}


/* =====================================================
   カウント減少
===================================================== */

function advanceCounters(
    resetDigit
) {

    digits.forEach(
        digit => {

            if (
                !digit.filled
                ||
                digit === resetDigit
                ||
                digit.noCorrectionNeeded
            ) {

                return;

            }


            if (
                digit.counter > 0
            ) {

                digit.counter--;

            }

        }
    );

}


/* =====================================================
   カウント0
===================================================== */

function checkCounterZero() {

    for (
        const digit of digits
    ) {

        if (
            digit.filled
            &&
            !digit.noCorrectionNeeded
            &&
            digit.counter <= 0
        ) {

            endGame(
                language === "ja"
                ?
                `小数第${digit.position}位の値が5ターンの間修正されませんでした。`
                :
                `Decimal digit ${digit.position} was not corrected for five turns.`,
                false
            );


            return true;

        }

    }


    return false;

}


/* =====================================================
   次のターン
===================================================== */

function nextTurn() {

    let safety = 0;


    do {

        currentTurnIndex =
            (
                currentTurnIndex + 1
            )
            %
            turnOrder.length;


        safety++;

    }

    while (
        currentPlayer().eliminated
        &&
        safety < 20
    );

}


/* =====================================================
   全員失格
===================================================== */

function checkElimination() {

    const alive =
        players.filter(
            player =>
                !player.eliminated
        );


    if (
        alive.length === 0
    ) {

        endGame(
            language === "ja"
            ? "全員が失格になりました。"
            : "All players were eliminated.",
            false
        );

        return true;

    }


    if (
        alive.length === 1
        &&
        players.length > 1
    ) {

        endGame(
            language === "ja"
            ? `${alive[0].name()}以外が全員失格になりました。`
            : `All players except ${alive[0].name()} were eliminated.`,
            false
        );

        return true;

    }


    return false;

}


/* =====================================================
   メッセージ
===================================================== */

function showMessage(
    text
) {

    document
    .getElementById("message")
    .textContent =
        text;

}


/* =====================================================
   終了
===================================================== */

function endGame(
    reason,
    clear
) {

    gameStarted =
        false;


    clearInterval(
        timerInterval
    );


    const finalNumber =
        getCurrentNumber();


    document
    .getElementById("gameScreen")
    .classList
    .add("hidden");


    document
    .getElementById("endScreen")
    .classList
    .remove("hidden");


    const title =
        document
        .getElementById("endTitle");


    title.textContent =
        clear
        ? "GAME CLEAR"
        : "GAME OVER";


    let html =
        `<p>${reason}</p>`;


    html +=
        `
        <p>
        √${x} =
        ${cleanNumber(sqrtX)}
        <br>
        ${
            language === "ja"
            ? "最終予測値"
            : "Final prediction"
        } =
        ${cleanNumber(finalNumber)}
        </p>
        `;


    if (
        gameMode === "normal"
        ||
        (
            gameMode === "infinite"
            &&
            infiniteScoreEnabled
        )
    ) {

        const ranking =
            [...players].sort(
                (a,b) =>
                    b.score - a.score
            );


        html +=
            `
            <h2>
            ${
                language === "ja"
                ? "最終ポイント"
                : "Final Points"
            }
            </h2>
            `;


        ranking.forEach(
            (player,index) => {

                html +=
                    `
                    <p>
                    ${index + 1}位　
                    ${player.name()}　
                    ${player.score}pt
                    ${
                        player.eliminated
                        ? (
                            language === "ja"
                            ? "（失格）"
                            : " (Eliminated)"
                        )
                        : ""
                    }
                    </p>
                    `;

            }
        );

    }


    if (
        gameMode === "infinite"
    ) {

        let reached =
            0;


        for (
            let i = 0;
            i < digits.length;
            i++
        ) {

            if (
                digits[i].filled
            ) {

                reached =
                    i + 1;

            }

            else {

                break;

            }

        }


        html +=
            `
            <p>
            ${
                language === "ja"
                ? `小数第${reached}位まで到達しました。`
                : `You reached decimal digit ${reached}.`
            }
            </p>
            `;

    }


    if (
        gameMode === "time"
    ) {

        const total =
            elapsedSeconds
            +
            penaltySeconds;


        html +=
            `
            <h2>
            ${
                language === "ja"
                ? "記録タイム"
                : "Final Time"
            }
            </h2>

            <p>
            ${formatTime(total)}
            </p>
            `;

    }


    document
    .getElementById("result")
    .innerHTML =
        html;

}


/* =====================================================
   設定画面
===================================================== */

function openSettings() {

    document
    .getElementById("startScreen")
    .classList
    .add("hidden");


    document
    .getElementById("settingsScreen")
    .classList
    .remove("hidden");

}


function closeSettings() {

    document
    .getElementById("settingsScreen")
    .classList
    .add("hidden");


    document
    .getElementById("startScreen")
    .classList
    .remove("hidden");

}

   ゲーム中の言語更新
===================================================== */

function updateGameTexts() {

    if (
        !gameStarted
    ) {

        return;

    }


    updateAll();

}
